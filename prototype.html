            <input type="date" value="${esc(reportFilters.to)}" onchange="reportFilters.to=this.value;render()"/>
          </div>
          <div class="field"><label>Producto</label>
            <select onchange="reportFilters.productId=this.value;render()">
              <option value="">Todos los productos</option>
              ${store.products.map(p => `<option value="${p.id}" ${reportFilters.productId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Categoría</label>
            <select onchange="reportFilters.category=this.value;render()">
              <option value="">Todas las categorías</option>
              ${cats.map(c => `<option value="${esc(c)}" ${reportFilters.category===c?'selected':''}>${esc(c)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Tipo de movimiento</label>
            <select onchange="reportFilters.type=this.value;render()">
              <option value="">Todos los tipos</option>
              <option value="in"         ${reportFilters.type==='in'        ?'selected':''}>Entradas</option>
              <option value="out"        ${reportFilters.type==='out'       ?'selected':''}>Salidas</option>
              <option value="adjust_pos" ${reportFilters.type==='adjust_pos'?'selected':''}>Ajuste (+)</option>
              <option value="adjust_neg" ${reportFilters.type==='adjust_neg'?'selected':''}>Ajuste (−)</option>
            </select>
          </div>
        </div>
      </section>

      <div class="grid grid-4 mt-16">
        <div class="stat-card">
          <div class="stat-label">Productos filtrados</div>
          <div class="stat-value">${filteredProducts.length}</div>
          <div class="stat-hint">${totalUnitsFiltered} unidad(es) en stock</div>
        </div>
        <div class="stat-card ok">
          <div class="stat-label">Entradas</div>
          <div class="stat-value">${totalIn}</div>
          <div class="stat-hint">Suma del período</div>
        </div>
        <div class="stat-card ${totalOut>totalIn?'alert':''}">
          <div class="stat-label">Salidas</div>
          <div class="stat-value">${totalOut}</div>
          <div class="stat-hint">Neto: ${(totalIn-totalOut)>=0?'+':''}${totalIn-totalOut}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Valor de inventario</div>
          <div class="stat-value" style="font-size:22px">${formatMoney(inventoryValue, currency)}</div>

          <span class="badge badge-muted">${filteredMovements.length} movimiento(s) en el rango</span>

function renderReportTab(products, movements, stock, currency) {
  if (reportTab === 'movements')     return renderMovementsReport(movements);
  if (reportTab === 'by-category')   return renderCategoryReport(products, movements, stock, currency);
  if (reportTab === 'top-products')  return renderTopProductsReport(products, movements, stock);
  if (reportTab === 'profitability') return renderProfitabilityReport(products, movements, currency);
  if (reportTab === 'forecast')      return renderForecastReport(products);
  return renderInventoryReport(products, movements, stock, currency);
}

function renderProfitabilityReport(products, movements, currency) {
  if (products.length === 0) return `<div class="empty"><div class="empty-icon">💰</div><strong>Sin datos</strong><div>Ajusta los filtros.</div></div>`;
  // Agrupa por producto: cantidad e ingresos con el precio real de cada movimiento.
  const byProduct = {};
  movements.forEach(m => {
    if (isIncoming(m.type)) return;
    const b = byProduct[m.productId] ||= { qty:0, revenue:0 };
    b.qty += m.quantity;
    b.revenue += movementRevenue(m);
  });
  const rows = products.map(p => {
    const b = byProduct[p.id] || { qty:0, revenue:0 };
    const qty = b.qty;
    const revenue = b.revenue;
    const withCost = hasCost(p);
    const cogs    = withCost ? qty * costOf(p) : 0;
    const profit  = withCost ? revenue - cogs  : 0;
    const avgPrice = qty > 0 ? revenue / qty : priceOf(p);
    return { p, qty, revenue, cogs, profit, withCost, avgPrice };
  }).sort((a,b) => b.profit - a.profit);

  // Totales — solo cuentan productos con costo definido (para no inflar utilidad con COGS = 0)
  const tot = rows.reduce((a,r) => r.withCost
    ? { qty:a.qty+r.qty, revenue:a.revenue+r.revenue, cogs:a.cogs+r.cogs, profit:a.profit+r.profit }
    : a
  , { qty:0, revenue:0, cogs:0, profit:0 });
  const totalMargin = tot.revenue > 0 ? (tot.profit / tot.revenue) * 100 : 0;
  const missingCost = rows.filter(r => !r.withCost && r.qty > 0).length;

  return `
    <div class="insight info" style="margin-bottom:14px">
      <div class="insight-icon">📐</div>
      <div>
        <div class="insight-title">Método de valoración: ${valuationMethodLabel()}</div>
        <div class="insight-msg">El COGS se calcula con el costo unitario efectivo del producto, derivado de las compras registradas.</div>
      </div>
    </div>
    ${missingCost > 0 ? `<div class="insight warning" style="margin-bottom:14px">
      <div class="insight-icon">⚠️</div>
      <div>
        <div class="insight-title">${missingCost} producto(s) vendidos sin costo cargado</div>
        <div class="insight-msg">La utilidad y el COGS no se calculan para estos productos. Edítalos o registra entradas con costo unitario para obtener el margen real.</div>
      </div>
    </div>` : ''}
    <div class="grid grid-4" style="margin-bottom:16px">
      <div class="stat-card"><div class="stat-label">Ingresos</div><div class="stat-value" style="font-size:22px">${formatMoney(tot.revenue, currency)}</div><div class="stat-hint">Solo productos con costo</div></div>
      <div class="stat-card"><div class="stat-label">COGS</div><div class="stat-value" style="font-size:22px">${formatMoney(tot.cogs, currency)}</div><div class="stat-hint">Costo mercancía vendida</div></div>
      <div class="stat-card ok"><div class="stat-label">Utilidad bruta</div><div class="stat-value" style="font-size:22px;color:var(--success)">${formatMoney(tot.profit, currency)}</div><div class="stat-hint">Ingresos − COGS</div></div>
      <div class="stat-card"><div class="stat-label">Margen bruto</div><div class="stat-value">${totalMargin.toFixed(1)}%</div><div class="stat-hint">Utilidad / ingresos</div></div>
    </div>
    <table class="table"><thead><tr>
      <th>Producto</th><th>Categoría</th>
      <th class="num">Unidades vendidas</th>
      <th class="num">Precio prom.</th>
      <th class="num">Ingresos</th>
      <th class="num">COGS</th>
      <th class="num">Utilidad</th>
      <th class="num">Margen</th>
    </tr></thead><tbody>
    ${rows.map(r => {
      const listPrice = priceOf(r.p);
      const diff = r.qty > 0 && listPrice > 0 ? ((r.avgPrice - listPrice) / listPrice) * 100 : 0;
      const priceHint = r.qty > 0 && Math.abs(diff) >= 0.5
        ? `<div style="font-size:10px;color:${diff < 0 ? 'var(--warning)' : 'var(--success)'}">${diff>0?'+':''}${diff.toFixed(1)}% vs lista</div>`
        : '';
      return `<tr${!r.withCost && r.qty > 0 ? ' style="opacity:.7"' : ''}>
      <td>
        <div style="font-weight:500">${esc(r.p.name)}</div>
        <div style="font-size:11px;color:var(--muted)">${esc(r.p.sku)}</div>
      </td>
      <td>${esc(r.p.category)}</td>
      <td class="num">${r.qty} ${esc(r.p.unit)}</td>
      <td class="num">${r.qty > 0 ? formatMoney(r.avgPrice, currency) : '<span class="text-muted">—</span>'}${priceHint}</td>
      <td class="num">${formatMoney(r.revenue, currency)}</td>
      <td class="num">${r.withCost ? formatMoney(r.cogs, currency) : '<span class="text-muted">—</span>'}</td>
      <td class="num" style="color:${r.withCost ? (r.profit >= 0 ? 'var(--success)' : 'var(--danger)') : 'var(--muted)'};font-weight:${r.withCost?600:400}">${r.withCost ? formatMoney(r.profit, currency) : '—'}</td>
      <td class="num">${r.withCost && r.qty > 0
        ? `<span class="badge ${r.revenue>0 && r.profit/r.revenue>=0.30 ? 'badge-ok' : r.revenue>0 && r.profit/r.revenue>=0.15 ? 'badge-info' : r.profit>0 ? 'badge-warn' : 'badge-muted'}">${r.revenue>0 ? ((r.profit/r.revenue)*100).toFixed(1) : '0.0'}%</span>`
        : marginBadge(r.p)}</td>
    </tr>`;
    }).join('')}
    </tbody></table>
    <details class="explain">
      <summary>¿Cómo se calculan los ingresos cuando el precio de venta varía?</summary>
      <p>Al registrar una <strong>salida por venta</strong> puedes ingresar el precio de venta real de esa transacción (descuento, promoción, ajuste). El sistema lo guarda junto con el movimiento y lo usa para calcular ingresos exactos en vez de asumir siempre el precio de lista.</p>
      <ul>
        <li><strong>Ingresos del producto</strong> = Σ(cantidad × precio de venta real). Si no se registró precio, se usa el precio de lista como respaldo.</li>
        <li><strong>Precio promedio</strong> = Ingresos ÷ unidades vendidas. Te muestra a qué precio promedio se movió realmente el producto en el período.</li>
        <li>Si el precio promedio es muy distinto al precio de lista, aparece una señal (verde si vendiste más caro, amarilla si vendiste más barato) para que detectes descuentos o cambios de estrategia.</li>
      </ul>
    </details>
    <details class="explain">
      <summary>¿Cómo se calcula el costo cuando los precios de compra cambian?</summary>
      <p>Cuando compras el mismo producto a diferentes precios, el sistema calcula el <strong>costo unitario efectivo</strong> usando el método de valoración configurado:</p>
      <ul>
        <li><strong>Promedio Ponderado (WAC)</strong> — el default, el más usado en Colombia. Fórmula:<br>
          <code>costo_promedio = Σ(cantidad × costo_unitario) / Σ(cantidad)</code><br>
          <em>Ejemplo:</em> compraste 40u a $2.400 y luego 30u a $2.500 → costo promedio = ((40×2400) + (30×2500)) / 70 = <strong>$2.443</strong>. Todas las ventas y el valor del inventario usan este promedio.
        </li>
        <li><strong>Último costo</strong> — siempre usa el costo de la compra más reciente. Útil para cotizar rápido, menos preciso contablemente.</li>
        <li><strong>FIFO</strong> — primero en entrar, primero en salir. Las ventas descargan el costo del lote más antiguo. En este prototipo se trata como WAC.</li>
      </ul>
      <p>Si un producto no tiene entradas con costo registrado, se usa el <strong>costo de referencia inicial</strong> ingresado al crearlo como respaldo.</p>
      <p><strong>Cómo actualizar el costo:</strong> al registrar una <strong>Nueva entrada</strong>, ingresa el costo unitario real de esa compra. El sistema recalcula automáticamente el costo promedio del producto.</p>
    </details>`;
}

  const movByProduct = {};
  movements.forEach(m => {
    if (!movByProduct[m.productId]) movByProduct[m.productId] = { in:0, out:0 };
    isIncoming(m.type) ? movByProduct[m.productId].in += m.quantity : movByProduct[m.productId].out += m.quantity;
  });
  return `<table class="table"><thead><tr>
    <th>SKU</th><th>Producto</th><th>Categoría</th>
    <th class="num">Stock</th><th class="num">Mín.</th>

    <th class="num">Valor</th><th>Estado</th>

function renderCategoryReport(products, movements, stock, currency) {
  const by = {};
  const bucket = c => (by[c] ||= { products:0, units:0, value:0, in:0, out:0 });
  products.forEach(p => {
    const r = bucket(p.category || '—');
    r.products += 1;
    const s = stock[p.id] ?? 0;
    r.units += Math.max(0, s);
    r.value += s * (p.price ?? 0);
  });
  movements.forEach(m => {
    const p = store.products.find(pp => pp.id === m.productId);
    if (!p) return;
    const r = bucket(p.category || '—');
    isIncoming(m.type) ? r.in += m.quantity : r.out += m.quantity;
  });
  const rows = Object.entries(by).sort((a,b) => b[1].value - a[1].value);
  if (rows.length === 0) return `<div class="empty"><div class="empty-icon">🏷️</div><strong>Sin categorías</strong></div>`;
  return `<table class="table"><thead><tr>
    <th>Categoría</th>
    <th class="num">Productos</th>
    <th class="num">Unidades en stock</th>
    <th class="num">Entradas</th>
    <th class="num">Salidas</th>
    <th class="num">Valor total</th>
  </tr></thead><tbody>
  ${rows.map(([c, r]) => `<tr>
    <td><strong>${esc(c)}</strong></td>
    <td class="num">${r.products}</td>
    <td class="num">${r.units}</td>
    <td class="num" style="color:var(--success)">+${r.in}</td>

}

function renderTopProductsReport(products, movements, stock) {
  const by = {};
  products.forEach(p => { by[p.id] = { p, in:0, out:0, total:0, stock: stock[p.id] ?? 0 }; });
  movements.forEach(m => {
    if (!by[m.productId]) return;
    isIncoming(m.type) ? by[m.productId].in += m.quantity : by[m.productId].out += m.quantity;
    by[m.productId].total += m.quantity;
  });
  const rows = Object.values(by).sort((a,b) => b.total - a.total).slice(0, 20);
  if (rows.length === 0 || rows.every(r => r.total === 0)) {
    return `<div class="empty"><div class="empty-icon">📊</div><strong>Sin movimiento</strong><div>Los productos filtrados no registran movimientos en el período.</div></div>`;
  }
  const max = Math.max(...rows.map(r => r.total), 1);
  return `<table class="table"><thead><tr>
    <th>#</th><th>Producto</th><th>Categoría</th>
    <th class="num">Stock</th>
    <th class="num">Entradas</th><th class="num">Salidas</th>

  }).join('')}

}

function downloadCsv(filename, rows) {
  const csv = rows.map(r => r.map(c => {
    const s = String(c ?? '');
    return /[",\n;]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function exportReportCsv() {
  const { filteredProducts, filteredMovements, stock } = computeReportData();
  let rows, filename;

  if (reportTab === 'movements') {
    rows = [['Fecha','SKU','Producto','Tipo','Cantidad','Precio/Costo unitario','Total','Motivo','Referencia']];
    [...filteredMovements].sort((a,b) => b.createdAt.localeCompare(a.createdAt)).forEach(m => {
      const inc = isIncoming(m.type);
      const p = store.products.find(pp => pp.id === m.productId);
      const unit = inc ? (Number(m.unitCost) || 0) : (Number(m.unitPrice) || priceOf(p));
      const total = unit > 0 ? Math.round(unit * m.quantity) : '';
      rows.push([m.createdAt, productSku(m.productId), productName(m.productId), MOVEMENT_LABELS[m.type], m.quantity, unit || '', total, m.reason, m.reference || '']);
    });
    filename = 'inventra-movimientos.csv';
  } else if (reportTab === 'by-category') {
    const by = {};
    const bucket = c => (by[c] ||= { products:0, units:0, value:0, in:0, out:0 });
    filteredProducts.forEach(p => {
      const r = bucket(p.category || '—');
      r.products += 1;
      const s = stock[p.id] ?? 0;
      r.units += Math.max(0, s);
      r.value += s * (p.price ?? 0);
    });
    filteredMovements.forEach(m => {
      const p = store.products.find(pp => pp.id === m.productId);
      if (!p) return;
      const r = bucket(p.category || '—');
      isIncoming(m.type) ? r.in += m.quantity : r.out += m.quantity;
    });
    rows = [['Categoría','Productos','Unidades','Entradas','Salidas','Valor total']];
    Object.entries(by).sort((a,b) => b[1].value - a[1].value).forEach(([c, r]) => {
      rows.push([c, r.products, r.units, r.in, r.out, Math.round(r.value)]);
    });
    filename = 'inventra-por-categoria.csv';
  } else if (reportTab === 'top-products') {
    const by = {};
    filteredProducts.forEach(p => { by[p.id] = { p, in:0, out:0, total:0, stock: stock[p.id] ?? 0 }; });
    filteredMovements.forEach(m => {
      if (!by[m.productId]) return;
      isIncoming(m.type) ? by[m.productId].in += m.quantity : by[m.productId].out += m.quantity;
      by[m.productId].total += m.quantity;
    });
    rows = [['SKU','Producto','Categoría','Stock','Entradas','Salidas','Total movido']];
    Object.values(by).sort((a,b) => b.total - a.total).forEach(r => {
      rows.push([r.p.sku, r.p.name, r.p.category, r.stock, r.in, r.out, r.total]);
    });
    filename = 'inventra-top-productos.csv';
  } else if (reportTab === 'profitability') {
    const byProduct = {};
    filteredMovements.forEach(m => {
      if (isIncoming(m.type)) return;
      const b = byProduct[m.productId] ||= { qty:0, revenue:0 };
      b.qty += m.quantity;
      b.revenue += movementRevenue(m);
    });
    rows = [['SKU','Producto','Categoría','Unidades vendidas','Precio promedio','Ingresos','COGS','Utilidad','Margen %','Observación']];
    filteredProducts.forEach(p => {
      const b = byProduct[p.id] || { qty:0, revenue:0 };
      const qty = b.qty;
      const revenue = b.revenue;
      const avgPrice = qty > 0 ? Math.round(revenue / qty) : '';
      const withCost = hasCost(p);
      const cogs    = withCost ? qty * costOf(p) : '';
      const profit  = withCost ? Math.round(revenue - qty * costOf(p)) : '';
      const margen  = withCost && revenue > 0 ? ((revenue - qty * costOf(p)) / revenue * 100).toFixed(1) : '';
      const note    = withCost ? '' : 'Falta costo';
      rows.push([p.sku, p.name, p.category, qty, avgPrice, Math.round(revenue), withCost ? Math.round(cogs) : '', profit, margen, note]);
    });
    filename = 'inventra-rentabilidad.csv';
  } else if (reportTab === 'forecast') {
    rows = [['SKU','Producto','Stock','Consumo diario','Días restantes','Cantidad sugerida','Pedir antes del']];
    filteredProducts.map(p => ({ p, s:suggestReorder(p) })).filter(x => x.s)
      .sort((a,b) => a.s.daysLeft - b.s.daysLeft).forEach(x => {
      rows.push([x.p.sku, x.p.name, stockOf(x.p.id), x.s.avgDaily.toFixed(2), x.s.daysLeft, x.s.qty, x.s.urgent ? 'PEDIR YA' : x.s.reorderByDate.toLocaleDateString('es')]);
    });
    filename = 'inventra-pronostico.csv';
  } else {
    const movByProduct = {};
    filteredMovements.forEach(m => {
      if (!movByProduct[m.productId]) movByProduct[m.productId] = { in:0, out:0 };
      isIncoming(m.type) ? movByProduct[m.productId].in += m.quantity : movByProduct[m.productId].out += m.quantity;
    });
    rows = [['SKU','Producto','Categoría','Unidad','Stock','Mínimo','Entradas','Salidas','Precio','Valor']];
    filteredProducts.forEach(p => {
      const s = stock[p.id] ?? 0;
      const mov = movByProduct[p.id] || { in:0, out:0 };
      rows.push([p.sku, p.name, p.category, p.unit, s, p.minStock, mov.in, mov.out, p.price ?? 0, Math.round(s * (p.price ?? 0))]);
    });
    filename = 'inventra-inventario.csv';
  }
  downloadCsv(filename, rows);
  toast('Reporte exportado.', 'success');
}

        ${catalogCount > 0 ? `
          <div class="text-muted" style="font-size:12px;margin-top:6px">
            ${(d.initialProducts).slice(0, 5).map(p => esc(p.name)).join(' · ')}${catalogCount > 5 ? ` … y ${catalogCount - 5} más` : ''}
          </div>` : ''}
      </div>
      <div class="summary-section">
        <div class="summary-section-title">Administrador</div>
        <div class="summary-row"><span class="summary-label">Nombre</span><span class="summary-value">${esc(d.adminName)}</span></div>
        <div class="summary-row"><span class="summary-label">Email</span><span class="summary-value">${esc(d.adminEmail)}</span></div>
      </div>
      <div class="summary-section">
        <div class="summary-section-title">Operación</div>
        <div class="summary-row"><span class="summary-label">Sucursal</span><span class="summary-value">${esc(d.branchName)}</span></div>
        <div class="summary-row"><span class="summary-label">Bodega</span><span class="summary-value">${esc(d.warehouseName)}</span></div>
        <div class="summary-row"><span class="summary-label">Valorización</span><span class="summary-value">${d.valuationMethod === 'fifo' ? 'FIFO' : 'Promedio ponderado'}</span></div>
        <div class="summary-row"><span class="summary-label">Stock negativo</span><span class="summary-value">${d.allowNegative === 'yes' ? 'Permitido' : 'Bloqueado'}</span></div>
        <div class="summary-row"><span class="summary-label">Umbral de ajustes</span><span class="summary-value">${d.adjustThreshold || 500} ${esc(d.currency)}</span></div>
      </div>
    `;
  }

  const showFooter = step > 0;
  const progress = Array.from({ length: total }, (_, i) => {
    const n = i + 1;
    const cls = n < step ? 'done' : (n === step ? 'current' : '');
    return `<div class="onb-step ${cls}"></div>`;
  }).join('');

  return `
    <div class="onboarding-layout">
      <div class="onb-header">
        <div class="onb-logo">📦</div>
        <div>
          <div class="onb-brand">Inventra AI</div>
          <div class="onb-tagline">Configuración inicial</div>
        </div>
      </div>
      <div class="onb-container">
        <div class="onb-card">
          ${step > 0 ? `<div class="onb-progress">${progress}</div>` : ''}
          <div class="onb-body">${body}</div>
          <div class="onb-footer">
            ${step === 0
              ? `<span class="onb-step-label">Comencemos</span><button class="btn btn-primary" onclick="nextOnb()">Empezar configuración →</button>`
              : `<button class="btn" onclick="prevOnb()">← Atrás</button>
                 <span class="onb-step-label">Paso ${step} de ${total}</span>
                 ${step === 6
                   ? `<button class="btn btn-primary" onclick="finishOnboarding()">✓ Crear empresa</button>`
                   : `<button class="btn btn-primary" onclick="nextOnb()">Continuar →</button>`}`}
          </div>
        </div>
      </div>
    </div>`;
}

function captureOnbFormState() {
  const form = document.getElementById('onb-main-form');
  if (!form) return;
  const fd = new FormData(form);
  for (const [k, v] of fd.entries()) {
    if (k === 'vertical') continue;
    onboardingState.data[k] = v;
  }
}

function onbInputChange(e) {
  const el = e.target;
  if (!el || !el.name || el.name === 'vertical') return;
  onboardingState.data[el.name] = el.value;
}

function selectVertical(code) {
  captureOnbFormState();
  const prev = onboardingState.data.vertical;
  onboardingState.data.vertical = code;
  // If the vertical changed, reset the seed catalog and the category/unit lists
  if (prev !== code) {
    onboardingState.data.initialProducts = defaultCategoriesFor(code).map(p => ({ ...p }));
    onboardingState.data.categoriesList  = [...defaultCategoriesListFor(code)];
    onboardingState.data.unitsList       = [...defaultUnitsListFor(code)];
    if (code !== 'other') onboardingState.data.customVerticalName = '';
  }
  render();
}

function ensureLists() {
  const d = onboardingState.data;
  if (!d.categoriesList) d.categoriesList = [...defaultCategoriesListFor(d.vertical)];
  if (!d.unitsList)      d.unitsList      = [...defaultUnitsListFor(d.vertical)];
}

function onCategoryPick(sel) {
  if (sel.value !== '__NEW__') return;
  const name = prompt('Nombre de la nueva categoría:');
  const clean = (name || '').trim();
  if (!clean) { sel.value = ''; return; }
  const list = onboardingState.data.categoriesList;
  if (!list.some(c => c.toLowerCase() === clean.toLowerCase())) list.push(clean);
  // Add option to this select and to any other category selects, then select it here
  const addOpt = (s) => {
    if (s.querySelector(`option[value="${CSS.escape(clean)}"]`)) return;
    const opt = document.createElement('option');
    opt.value = clean; opt.textContent = clean;
    s.insertBefore(opt, s.querySelector('option[value="__NEW__"]'));
  };
  document.querySelectorAll('select[data-role="category"]').forEach(addOpt);
  sel.value = clean;
  toast(`Categoría "${clean}" agregada.`, 'success');
}

function onUnitPick(sel) {
  if (sel.value !== '__NEW__') return;
  const name = prompt('Nombre de la nueva unidad de medida:');
  const clean = (name || '').trim();
  if (!clean) { sel.value = ''; return; }
  const list = onboardingState.data.unitsList;
  if (!list.some(u => u.toLowerCase() === clean.toLowerCase())) list.push(clean);
  const addOpt = (s) => {
    if (s.querySelector(`option[value="${CSS.escape(clean)}"]`)) return;
    const opt = document.createElement('option');
    opt.value = clean; opt.textContent = clean;
    s.insertBefore(opt, s.querySelector('option[value="__NEW__"]'));
  };
  document.querySelectorAll('select[data-role="unit"]').forEach(addOpt);
  sel.value = clean;
  toast(`Unidad "${clean}" agregada.`, 'success');
}

function submitOnbStep(e) { e?.preventDefault(); nextOnb(); }

function nextOnb() {
  const step = onboardingState.step;
  if (step === 0) { onboardingState.step = 1; render(); return; }
  if (step === 2) {
    if (!onboardingState.data.vertical) { toast('Selecciona un tipo de negocio.', 'error'); return; }
    if (onboardingState.data.vertical === 'other') {
      const name = (document.getElementById('custom-vertical-name')?.value || '').trim();
      if (!name) { toast('Describe tu tipo de negocio.', 'error'); return; }
      onboardingState.data.customVerticalName = name;
    }
    // Ensure catalog seeds are ready for step 3
    if (!onboardingState.data.initialProducts) {
      onboardingState.data.initialProducts = defaultCategoriesFor(onboardingState.data.vertical).map(p => ({ ...p }));
    }
    onboardingState.step = 3; render(); return;
  }
  if (step === 3) {
    // Catalog step — no required form; can continue even if empty
    onboardingState.step = 4; render(); return;
  }
  // steps 1, 4, 5 have forms
  const form = document.getElementById('onb-form');
  if (form) {
    if (!form.reportValidity()) return;
    const fd = new FormData(form);
    for (const [k, v] of fd.entries()) onboardingState.data[k] = v;
  }
  if (step < 6) { onboardingState.step += 1; render(); }
}
function prevOnb() {
  if (onboardingState.step > 0) { onboardingState.step -= 1; render(); }
}

// ----- Catalog helpers (onboarding step 3) -----
function addCatalogRow(e) {
  e.preventDefault();
  const f = e.target;
  const sku = f.sku.value.trim();
  const name = f.name.value.trim();
  const list = onboardingState.data.initialProducts || (onboardingState.data.initialProducts = []);
  if (list.some(p => p.sku.toLowerCase() === sku.toLowerCase())) {
    toast(`Ya hay un producto con SKU "${sku}".`, 'error'); return;
  }
  list.push({
    sku, name,
    category: f.category.value.trim(),
    unit: f.unit.value.trim(),
    minStock: Number(f.minStock.value) || 0,
    currentStock: Number(f.currentStock?.value || 0),
    price: Number(f.price.value) || 0,
  });
  toast(`"${name}" agregado al catálogo.`, 'success');
  render();
}
function removeCatalogRow(index) {
  const list = onboardingState.data.initialProducts || [];
  list.splice(index, 1);
  captureOnbFormState();
  render();
}
function editCatalogStock(index, value) {
  const list = onboardingState.data.initialProducts;
  if (list && list[index]) list[index].currentStock = Math.max(0, Number(value) || 0);
}

// --- Single-page onboarding helpers ---
function addCatalogFromFields() {
  const sku = (document.getElementById('cf-sku')?.value || '').trim();
  const name = (document.getElementById('cf-name')?.value || '').trim();
  const category = (document.getElementById('cf-category')?.value || '').trim();
  const unit = (document.getElementById('cf-unit')?.value || '').trim();
  const minStock = Number(document.getElementById('cf-min')?.value || 0);
  const currentStock = Number(document.getElementById('cf-cur')?.value || 0);
  const cost = Number(document.getElementById('cf-cost')?.value || 0);
  const price = Number(document.getElementById('cf-price')?.value || 0);
  const karatEl = document.getElementById('cf-karat');

  if (!sku || !name || !category || !unit) {
    toast('Completa SKU, nombre, categoría y unidad.', 'error'); return;
  }
  if (category === '__NEW__' || unit === '__NEW__') {
    toast('Elige o agrega una categoría/unidad válida.', 'error'); return;
  }
  const list = onboardingState.data.initialProducts || (onboardingState.data.initialProducts = []);
  if (list.some(p => p.sku.toLowerCase() === sku.toLowerCase())) {
    toast(`Ya hay un producto con SKU "${sku}".`, 'error'); return;
  }
  const row = { sku, name, category, unit,
    minStock: minStock || 0, currentStock: currentStock || 0, cost: cost || 0, price: price || 0 };
  if (karatEl) row.karat = Number(karatEl.value) || 0;
  list.push(row);
  toast(`"${name}" agregado al catálogo.`, 'success');
  captureOnbFormState();
  render();
}

function submitOneShot(e) {
  e.preventDefault();
  const f = e.target;
  if (!f.reportValidity()) return;
  const d = onboardingState.data;
  if (!d.vertical) { toast('Selecciona un tipo de negocio.', 'error'); return; }
  if (d.vertical === 'other') {
    const customName = (document.getElementById('custom-vertical-name')?.value || '').trim();
    if (!customName) { toast('Describe tu tipo de negocio.', 'error'); return; }
    d.customVerticalName = customName;
  }
  const fd = new FormData(f);
  for (const [k, v] of fd.entries()) d[k] = v;
  finishOnboarding();
}

// ----- Vertical-aware suggestions (help placeholders in catalog step) -----
function suggestCategories(vertical) {
  return ({
    retail:   ['Abarrotes','Bebidas','Lácteos','Panadería','Aseo'],
    bakery:   ['Insumos','Lácteos','Saborizantes','Productos terminados'],
    hardware: ['Tornillería','Herramientas','Pinturas','Eléctricos','Plomería'],
    pharmacy: ['Analgésicos','Antibióticos','Vitaminas','Higiene personal'],
    petshop:  ['Alimento','Accesorios','Medicamentos','Higiene'],
    other:    ['General'],
  })[vertical] || ['General'];
}
function suggestUnits(vertical) {
  return ({
    retail:   ['Unidad','Kg','Litro','Paquete'],
    bakery:   ['Kg','g','Litro','ml','Unidad','Docena'],
    hardware: ['Unidad','Metro','Rollo','Caja','Litro'],
    pharmacy: ['Caja','Unidad','Frasco','Blíster'],
    petshop:  ['Bolsa','Unidad','Kg','Lata'],
    other:    ['Unidad','Kg','Litro','Paquete','Caja'],
  })[vertical] || ['Unidad'];
}
function suggestCategory(v) { return suggestCategories(v)[0] || 'General'; }
function suggestUnit(v)     { return suggestUnits(v)[0] || 'Unidad'; }
function suggestName(v) {
  return ({
    retail:'Arroz', bakery:'Vainilla', hardware:'Martillo',
    pharmacy:'Loratadina 10mg', petshop:'Arena sanitaria', jewelry:'Oro 18K', other:'Producto X',
  })[v] || 'Nuevo producto';
}
function suggestSku(v, n) {
  const p = ({ retail:'PRO', bakery:'INS', hardware:'HWR', pharmacy:'MED', petshop:'PET', jewelry:'ORO', other:'SKU' })[v] || 'SKU';
  return `${p}-${String(n).padStart(3,'0')}`;
}

// ----- Users view
function viewUsers() {
  if (!can('manage_users')) {
    return `<div class="page"><div class="empty" style="padding:48px"><div class="empty-icon">🔒</div><strong>Sin acceso</strong><div>Tu perfil (${esc(roleLabel(activeUser()?.role))}) no puede gestionar usuarios. Solicítalo a un Propietario.</div></div></div>`;
  }
  const me = activeUser();
  const jewelry = isJewelry();
  return `
    <div class="page">
      <div class="page-header">
        <div>
          <h1 class="page-title">Usuarios y permisos</h1>
          <div class="page-subtitle">${store.users.length} usuario(s) · asigna un perfil a cada persona del equipo</div>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <h2>Agregar usuario</h2>
        <form onsubmit="submitUser(event)">
          <div class="form-grid">
            <div class="field"><label class="required">Nombre</label><input name="name" required placeholder="Ej: María Gómez"/></div>
            <div class="field"><label>Correo</label><input name="email" type="email" placeholder="maria@empresa.com"/></div>
            <div class="field">
              <label class="required">Perfil / Rol</label>
              <select name="role" required>
                ${Object.entries(ROLES).map(([code,r]) => `<option value="${code}">${r.icon} ${r.name}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="row" style="margin-top:12px;justify-content:flex-end">
            <button type="submit" class="btn btn-primary">+ Agregar usuario</button>
          </div>
        </form>
      </div>

      <div class="card" style="margin-bottom:16px">
        <h2>Equipo</h2>
        <table class="table">
          <thead><tr><th>Nombre</th><th>Correo</th><th>Perfil</th><th>Activo</th><th></th></tr></thead>
          <tbody>
          ${store.users.map(u => `
            <tr${u.id === me?.id ? ' style="background:var(--primary-soft)"' : ''}>
              <td style="font-weight:500">${esc(u.name)} ${u.id === me?.id ? '<span class="badge badge-ok">tú</span>' : ''}</td>
              <td>${esc(u.email || '—')}</td>
              <td>
                <select onchange="updateUserRole('${u.id}', this.value)">
                  ${Object.entries(ROLES).map(([code,r]) => `<option value="${code}" ${u.role===code?'selected':''}>${r.icon} ${r.name}</option>`).join('')}
                </select>
              </td>
              <td>${u.id === (load(LS_ACTIVE,null)) ? '<span class="badge badge-ok">en sesión</span>' : `<button class="btn btn-sm" onclick="switchActiveUser('${u.id}')">Entrar como</button>`}</td>
              <td><button class="btn btn-sm" onclick="removeUser('${u.id}')">Eliminar</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>

      <div class="card">
        <h2>¿Qué puede hacer cada perfil?</h2>
        <div style="overflow:auto">
        <table class="table">
          <thead><tr><th>Permiso</th>${Object.values(ROLES).map(r => `<th class="num" style="font-size:12px">${r.icon}<br>${esc(r.name)}</th>`).join('')}</tr></thead>
          <tbody>
          ${Object.entries(PERMISSIONS).filter(([code]) => jewelry || (code !== 'gold_spot' && code !== 'gold_buy')).map(([code,label]) => `
            <tr${(code==='gold_spot'||code==='gold_buy') ? ' style="background:#fef9e7"' : ''}>
              <td>${esc(label)}${(code==='gold_spot'||code==='gold_buy') ? ' <span class="badge" style="background:#e8d48a;color:#7a5c00">💍 joyería</span>' : ''}</td>
              ${Object.values(ROLES).map(r => `<td class="num">${(r.perms==='*'||r.perms.includes(code)) ? '<span style="color:var(--success);font-weight:700">✓</span>' : '<span class="text-muted">—</span>'}</td>`).join('')}
            </tr>`).join('')}
          </tbody>
        </table>
        </div>
        <div class="hint" style="margin-top:8px">ℹ️ En esta versión los permisos se aplican en la interfaz. La seguridad real (login con contraseña y validación en servidor) llegará con la integración a Firebase.</div>
      </div>
    </div>`;
}
function submitUser(e) {
  e.preventDefault();
  const f = e.target;
  try {
    addUser(f.name.value, f.email.value, f.role.value);
    toast(`Usuario "${f.name.value.trim()}" agregado.`, 'success');
    render();
  } catch (err) { toast(err.message, 'error'); }
}

// ----- Main render
function render() {
  const app = document.getElementById('app');
  if (!hasTenant()) {
    app.innerHTML = viewOnboarding();
    return;
  }
  // Shell with sidebar + main
  app.innerHTML = `
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-icon">📦</span>
          <div>
            <div class="brand-title">${esc(store.tenant.name)}</div>
            <div class="brand-sub">${(VERTICALS.find(v => v.code === store.tenant.vertical)?.icon || '📦')} ${esc(store.tenant.vertical === 'other' ? (store.tenant.customVerticalName || 'Negocio') : (VERTICALS.find(v => v.code === store.tenant.vertical)?.name || 'Negocio'))} · ${esc(store.tenant.currency)}</div>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-footer">
          ${(() => { const au = activeUser(); return `
          <div style="padding:8px 4px;margin-bottom:8px;font-size:11px;color:#94a3b8">
            <div style="color:#e2e8f0;font-weight:500">${esc(au?.name || store.user.name)}</div>
            <div>${esc(au ? roleLabel(au.role) : store.user.role)}</div>
          </div>
          ${(store.users && store.users.length > 1) ? `
          <div style="padding:0 4px 8px;font-size:11px;color:#94a3b8">
            <label style="display:block;margin-bottom:4px">Operar como</label>
            <select onchange="switchActiveUser(this.value)" style="width:100%;font-size:12px;padding:4px 6px;border-radius:6px">
              ${store.users.map(u => `<option value="${u.id}" ${u.id===(load(LS_ACTIVE,null))?'selected':''}>${esc(u.name)} — ${ROLES[u.role]?.name || u.role}</option>`).join('')}
            </select>
          </div>` : ''}`; })()}
          <div style="display:flex;flex-direction:column;gap:6px">
            <button class="btn btn-primary btn-sm" onclick="startClientDemo()">🆕 Demo con datos del cliente</button>
            <button class="btn btn-sm" onclick="restoreDemo()">↺ Restaurar demo de muestra</button>
          </div>
        </div>
      </aside>
      <main class="main" id="main"></main>
    </div>`;

  renderSidebar();
  const views = {
    'dashboard': viewDashboard,
    'products':  viewProducts,
    'stock-in':  viewStockIn,
    'stock-out': viewStockOut,
    'movements': viewMovements,
    'reports':   viewReports,
    'insights':  viewInsights,
    'alerts':    viewAlerts,
    'users':     viewUsers,
  };
  // Bloqueo de acceso: si el rol activo no tiene permiso para la vista, redirige al dashboard.
  const navItem = NAV.find(n => n.path === currentView);
  if (navItem && navItem.perm && !can(navItem.perm)) {
    document.getElementById('main').innerHTML = `<div class="page"><div class="empty" style="padding:48px"><div class="empty-icon">🔒</div><strong>Sin acceso a esta sección</strong><div>Tu perfil (${esc(roleLabel(activeUser()?.role))}) no tiene permiso para ver “${esc(navItem.label)}”.</div></div></div>`;
    renderChat();
    return;
  }
  const v = views[currentView] || viewDashboard;
  document.getElementById('main').innerHTML = v();
  renderChat();
}

// Bootstrap: if nothing is stored yet (first ever open), pre-load the sample demo.
if (!hasTenant() && store.products.length === 0 && store.movements.length === 0) {
  seedDemoCompany();
}
render();
</script>
