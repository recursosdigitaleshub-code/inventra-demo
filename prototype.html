<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Inventra AI · Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='0' y='13' font-size='14'>📦</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f172a; --surface:#fff; --surface-2:#f6f8fb; --surface-3:#eef2f7;
  --border:#e4e9f0; --border-strong:#d4dbe6; --text:#0f1b2d; --muted:#64748b;
  --primary:#2563eb; --primary-hover:#1d4ed8; --primary-soft:#eef4ff; --primary-deep:#1e40af;
  --success:#15a34a; --success-soft:#dcfce7;
  --warning:#d97706; --warning-soft:#fef3c7;
  --danger:#dc2626;  --danger-soft:#fee2e2;
  --radius:9px; --radius-lg:14px; --radius-xl:20px;
  --shadow-sm:0 1px 2px rgba(16,30,54,.06), 0 1px 1px rgba(16,30,54,.04);
  --shadow:0 6px 20px -6px rgba(16,30,54,.14), 0 2px 6px -2px rgba(16,30,54,.08);
  --shadow-lg:0 20px 48px -12px rgba(16,30,54,.22), 0 8px 20px -8px rgba(16,30,54,.12);
  --ring:0 0 0 3px var(--primary-soft);
  --ease:cubic-bezier(.32,.72,.28,1);
  --font-display:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-body:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-family:var(--font-body);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--surface-2);color:var(--text);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background-image:
    radial-gradient(900px 500px at 100% -5%, rgba(37,99,235,.05), transparent 60%),
    radial-gradient(700px 460px at -10% 110%, rgba(37,99,235,.04), transparent 55%);
  background-attachment:fixed;
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0 0 12px;font-weight:700;font-family:var(--font-display);letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:18px} h3{font-size:16px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--surface-3);padding:1px 6px;border-radius:4px}

/* shell */
.shell{display:flex;min-height:100vh}
.sidebar{width:244px;min-width:244px;background:linear-gradient(185deg,#101a2e 0%,#0b1322 100%);color:#e2e8f0;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;border-right:1px solid rgba(255,255,255,.04)}
.brand{display:flex;gap:11px;align-items:center;padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.brand-icon{font-size:24px;filter:drop-shadow(0 2px 6px rgba(37,99,235,.5))}
.brand-title{font-weight:700;font-size:15px;font-family:var(--font-display);letter-spacing:-.01em}
.brand-sub{font-size:11px;color:#94a3b8}
.nav{display:flex;flex-direction:column;gap:3px;padding:16px 10px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#aeb9cc;cursor:pointer;font-size:13.5px;font-weight:500;position:relative;user-select:none;transition:background 180ms var(--ease),color 180ms var(--ease),transform 120ms var(--ease)}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item:active{transform:scale(.985)}
.nav-item.active{background:linear-gradient(100deg,#2563eb,#1d4ed8);color:#fff;font-weight:600;box-shadow:0 6px 16px -6px rgba(37,99,235,.7)}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:#fff;border-radius:0 3px 3px 0}
.nav-icon{width:18px;text-align:center;font-size:15px}
.nav-label{flex:1}
.nav-badge{background:#dc2626;color:#fff;font-size:11px;padding:1px 7px;border-radius:999px;font-weight:600;box-shadow:0 2px 6px rgba(220,38,38,.45)}
.sidebar-footer{padding:12px;border-top:1px solid #1e293b}
.sidebar-footer .btn{width:100%;color:#cbd5e1;background:transparent;border-color:transparent}
.sidebar-footer .btn:hover{background:#1e293b;color:#fff}
.main{flex:1;overflow-x:auto}

/* page */
.page{padding:26px 34px;max-width:1400px;animation:pageIn .4s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-size:23px;font-weight:700;margin:0;font-family:var(--font-display);letter-spacing:-.02em}
.page-subtitle{color:var(--muted);font-size:13px;margin-top:3px}

/* card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);transition:box-shadow 220ms var(--ease),border-color 220ms var(--ease)}
.card:hover{box-shadow:var(--shadow);border-color:var(--border-strong)}
.card + .card{margin-top:16px}

/* grid */
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.spacer{flex:1}

/* button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--radius);border:1px solid var(--border-strong);font-size:13.5px;font-weight:600;cursor:pointer;transition:background 160ms var(--ease),border-color 160ms var(--ease),transform 100ms var(--ease),box-shadow 160ms var(--ease);background:var(--surface);color:var(--text);font-family:inherit;box-shadow:var(--shadow-sm)}
.btn:hover:not(:disabled){background:var(--surface-3);border-color:var(--muted)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.99)}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(180deg,#3b82f6,var(--primary));color:#fff;border-color:var(--primary-deep);box-shadow:0 4px 12px -4px rgba(37,99,235,.6),inset 0 1px 0 rgba(255,255,255,.18)}
.btn-primary:hover:not(:disabled){background:linear-gradient(180deg,#2f7bf4,var(--primary-hover));border-color:var(--primary-deep)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px}

/* form */
.form-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500}
.field .required::after{content:" *";color:var(--danger)}
.field input,.field select,.field textarea{padding:9px 12px;border:1px solid var(--border-strong);border-radius:var(--radius);font-size:14px;background:var(--surface);color:var(--text);font-family:inherit;transition:border-color 150ms var(--ease),box-shadow 150ms var(--ease),background 150ms var(--ease)}
.field input:hover,.field select:hover,.field textarea:hover{border-color:var(--muted)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring)}
.field.invalid input,.field.invalid select{border-color:var(--danger)}
.field .error{color:var(--danger);font-size:12px}
.field .hint{color:var(--muted);font-size:12px}

/* table */
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px}
.table th{font-weight:600;color:var(--muted);background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;z-index:1}
.table thead th:first-child{border-top-left-radius:8px}
.table thead th:last-child{border-top-right-radius:8px}
.table tbody tr{transition:background 130ms var(--ease)}
.table tbody tr:hover{background:var(--primary-soft)}
.table tbody tr:last-child td{border-bottom:none}
.table td.num{text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid transparent}
.badge-ok{border-color:rgba(21,163,74,.2)}
.badge-warn{border-color:rgba(217,119,6,.22)}
.badge-danger{border-color:rgba(220,38,38,.2)}
.badge-ok{background:var(--success-soft);color:var(--success)}
.badge-warn{background:var(--warning-soft);color:var(--warning)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-info{background:var(--primary-soft);color:var(--primary)}
.badge-muted{background:var(--surface-3);color:var(--muted)}

/* toasts */
.toast-container{position:fixed;top:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:9999}
.toast{background:var(--surface);border:1px solid var(--border);border-left-width:4px;padding:13px 16px;border-radius:var(--radius);box-shadow:var(--shadow-lg);min-width:260px;max-width:360px;font-size:13px;animation:slideIn 320ms var(--ease)}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.info{border-left-color:var(--primary)}
@keyframes slideIn{from{transform:translateX(120%) scale(.96);opacity:0}to{transform:none;opacity:1}}

/* empty */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:.85;filter:grayscale(.1)}
.empty strong{display:block;color:var(--text);font-family:var(--font-display);margin-bottom:4px}

/* stat */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);transition:transform 220ms var(--ease),box-shadow 220ms var(--ease),border-color 220ms var(--ease);position:relative;overflow:hidden}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.stat-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:8px}
.stat-value{font-size:29px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--font-display);letter-spacing:-.02em}
.stat-hint{color:var(--muted);font-size:12px;margin-top:4px}
.stat-card.alert{border-left:4px solid var(--danger)}
.stat-card.ok{border-left:4px solid var(--success)}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(11,19,34,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px;animation:fadeIn 200ms var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);max-width:720px;width:100%;max-height:90vh;overflow:auto;animation:modalIn 320ms var(--ease)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.modal-header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h2{margin:0}
.modal-body{padding:20px}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.close-x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:4px}
.close-x:hover{background:var(--surface-3)}

/* entrada escalonada de tarjetas (primer plano del dashboard) */
.grid-4 > *{animation:cardRise .5s var(--ease) backwards}
.grid-4 > *:nth-child(1){animation-delay:.04s}
.grid-4 > *:nth-child(2){animation-delay:.10s}
.grid-4 > *:nth-child(3){animation-delay:.16s}
.grid-4 > *:nth-child(4){animation-delay:.22s}
@keyframes cardRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* scrollbar refinado */
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;border:2px solid var(--surface-2)}
*::-webkit-scrollbar-thumb:hover{background:var(--muted)}

/* utilities */
.mt-12{margin-top:12px} .mt-16{margin-top:16px} .mt-20{margin-top:20px}
.w-100{width:100px} .text-muted{color:var(--muted)}
.coverage-bar{background:var(--surface-3);border-radius:999px;height:6px;overflow:hidden;width:100px}
.coverage-fill{height:100%}

/* onboarding */
.onboarding-layout{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 100%);color:#fff}
.onb-header{padding:24px 32px;display:flex;align-items:center;gap:12px}
.onb-logo{font-size:28px}
.onb-brand{font-weight:700;font-size:18px}
.onb-tagline{font-size:12px;color:#94a3b8}
.onb-container{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.onb-card{background:#fff;color:var(--text);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:720px;overflow:hidden}
.onb-progress{display:flex;padding:20px 32px 0;gap:8px}
.onb-step{flex:1;height:4px;background:var(--surface-3);border-radius:2px}
.onb-step.done{background:var(--success)}
.onb-step.current{background:var(--primary)}
.onb-body{padding:32px}
.onb-eyebrow{color:var(--primary);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.onb-title{font-size:24px;margin-bottom:8px}
.onb-subtitle{color:var(--muted);margin-bottom:24px}
.onb-footer{padding:16px 32px;background:var(--surface-2);border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.onb-step-label{font-size:12px;color:var(--muted)}

/* vertical selector */
.vertical-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:8px}
.vertical-card{background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;text-align:center;transition:transform 180ms var(--ease),border-color 180ms var(--ease),background 180ms var(--ease),box-shadow 180ms var(--ease)}
.vertical-card:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-3px);box-shadow:var(--shadow)}
.vertical-card.selected{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 3px rgba(37,99,235,.18),var(--shadow)}
.vertical-card:active{transform:translateY(-1px) scale(.99)}
.vertical-icon{font-size:30px;margin-bottom:5px;transition:transform 180ms var(--ease)}
.vertical-card:hover .vertical-icon{transform:scale(1.12)}
.vertical-name{font-weight:500;font-size:13px}

/* welcome */
.welcome-hero{text-align:center;padding:40px 32px 32px}
.welcome-icon{font-size:48px;margin-bottom:12px}
.welcome-title{font-size:28px;margin-bottom:8px}
.welcome-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:24px;padding:0 32px}
.feature-item{text-align:left;display:flex;gap:10px;align-items:flex-start}
.feature-check{color:var(--success);font-weight:700}
.summary-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.summary-row:last-child{border-bottom:none}
.summary-label{color:var(--muted)}
.summary-value{font-weight:500;text-align:right}
.summary-section{margin-bottom:16px}
.summary-section-title{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em;font-weight:600;margin-bottom:8px}

/* ai / chat / insights */
.fab{position:fixed;right:24px;bottom:24px;width:58px;height:58px;border-radius:50%;background:linear-gradient(150deg,#3b82f6,var(--primary-hover));color:#fff;border:none;box-shadow:0 14px 30px -8px rgba(37,99,235,.65),inset 0 1px 0 rgba(255,255,255,.25);cursor:pointer;font-size:24px;z-index:500;display:flex;align-items:center;justify-content:center;transition:transform 220ms var(--ease),box-shadow 220ms var(--ease)}
.fab:hover{transform:scale(1.1) rotate(4deg);box-shadow:0 18px 38px -8px rgba(37,99,235,.75)}
.fab:active{transform:scale(1.02)}
.chat-drawer{position:fixed;right:24px;bottom:24px;width:380px;max-width:calc(100vw - 48px);height:580px;max-height:calc(100vh - 48px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 24px 60px rgba(15,23,42,.3);display:flex;flex-direction:column;z-index:600;overflow:hidden}
.chat-header{padding:14px 16px;background:var(--primary);color:#fff;display:flex;justify-content:space-between;align-items:center}
.chat-header .close-x{color:#fff}
.chat-header .close-x:hover{background:rgba(255,255,255,.15)}
.chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.chat-msg{padding:9px 12px;border-radius:12px;max-width:88%;font-size:13px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.chat-msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:3px}
.chat-msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:3px}
.chat-suggestions{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid var(--border);background:var(--surface)}
.chat-chip{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--surface-3);color:var(--text);border:1px solid var(--border);cursor:pointer;font-family:inherit}
.chat-chip:hover{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.chat-input{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:6px;background:var(--surface)}
.chat-input input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:13px}
.chat-input input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}

.health-hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.health-gauge{position:relative;width:140px;height:140px;flex-shrink:0}
.health-gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.health-gauge-value{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700}
.health-gauge-value .big{font-size:36px;line-height:1}
.health-gauge-value .small{font-size:11px;color:var(--muted);margin-top:4px;font-weight:500}

.abc-card{border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:transform 150ms,box-shadow 150ms;display:flex;flex-direction:column;min-height:210px}
.abc-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(15,23,42,.12)}
.abc-count{font-size:30px;font-weight:700;line-height:1}
.abc-label{font-weight:600;margin-top:4px;font-size:13px}
.abc-hint{font-size:11px;opacity:.75;margin-top:4px}
.abc-top{margin-top:10px;padding-top:10px;border-top:1px solid rgba(15,23,42,.1);text-align:left;flex:1;font-size:11.5px;line-height:1.35}
.abc-top-item{display:flex;justify-content:space-between;gap:6px;padding:2px 0}
.abc-top-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;font-weight:500}
.abc-top-val{opacity:.8;font-size:10.5px;white-space:nowrap}
.abc-top-more{opacity:.65;font-size:10.5px;font-style:italic;margin-top:3px}
.abc-empty{opacity:.65;font-size:11px;font-style:italic}
.abc-cta{margin-top:8px;padding-top:6px;font-size:10.5px;font-weight:600;border-top:1px solid rgba(15,23,42,.08);opacity:.85}

.insight{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 16px;border-radius:var(--radius);border-left:4px solid var(--border);background:var(--surface-2);margin-bottom:10px}
.insight.danger{border-left-color:var(--danger);background:var(--danger-soft)}
.insight.warning{border-left-color:var(--warning);background:var(--warning-soft)}
.insight.info{border-left-color:var(--primary);background:var(--primary-soft)}
.insight.success{border-left-color:var(--success);background:var(--success-soft)}
.insight-icon{font-size:24px;width:32px;text-align:center;line-height:1}
.insight-title{font-weight:600;margin-bottom:3px;font-size:14px}
.insight-msg{font-size:13px;color:var(--text)}
.insight-products{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.insight-chip{font-size:11px;padding:3px 9px;background:rgba(255,255,255,.7);border:1px solid rgba(15,23,42,.08);border-radius:6px;color:var(--text)}

.coverage-inline{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.coverage-dot{width:8px;height:8px;border-radius:50%}

.explain{margin-top:14px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--border);padding-top:10px}

<script>
/* ============================================================
   INVENTRA AI — Prototipo funcional (vanilla JS + localStorage)
   Arquitectura:
   - Estado único en window.store
   - Stock derivado de movements (nunca se almacena directo)
   - Persistencia en localStorage
   - Render reactivo: cualquier mutación llama a render()
   ============================================================ */

const LS_TENANT    = 'inventra.demo.tenant';
const LS_USER      = 'inventra.demo.user';
const LS_BRANCHES  = 'inventra.demo.branches';
const LS_SETTINGS  = 'inventra.demo.settings';
const LS_PRODUCTS  = 'inventra.demo.products';
const LS_MOVEMENTS = 'inventra.demo.movements';
const LS_USERS     = 'inventra.demo.users';      // lista de usuarios del tenant
const LS_ACTIVE    = 'inventra.demo.activeUser'; // id del usuario activo (selector)

const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);

// ---------- ROLES Y PERMISOS ----------
// Catálogo de permisos granulares. Cada rol activa un subconjunto.
const PERMISSIONS = {
  view_dashboard:  'Ver dashboard y panorama',
  manage_products: 'Crear / editar / eliminar productos',
  stock_in:        'Registrar entradas de inventario',
  stock_out:       'Registrar salidas / ventas',
  adjust:          'Hacer ajustes de inventario',
  view_costs:      'Ver costos y márgenes',
  view_reports:    'Ver reportes e inteligencia',
  export:          'Exportar datos (CSV)',
  manage_users:    'Gestionar usuarios y roles',
  settings:        'Configuración de la empresa',
  danger_zone:     'Restaurar / borrar datos',
  // Específicos de joyería (alto valor del oro):
  gold_spot:       'Editar la cotización (spot) del oro',
  gold_buy:        'Comprar oro a clientes (oro usado)',
};

// Roles predefinidos. `*` = todos los permisos.
const ROLES = {
  owner:   { name:'Propietario', icon:'👑', desc:'Acceso total al sistema.',
    perms:'*' },
  manager: { name:'Gerente', icon:'🧑‍💼', desc:'Opera y supervisa; no gestiona usuarios ni borra datos.',
    perms:['view_dashboard','manage_products','stock_in','stock_out','adjust','view_costs','view_reports','export','settings','gold_spot','gold_buy'] },
  cashier: { name:'Cajero / Vendedor', icon:'🧾', desc:'Registra ventas y consulta stock. No ve costos.',
    perms:['view_dashboard','stock_out','view_reports'] },
  stock:   { name:'Almacenista', icon:'📦', desc:'Recibe mercancía y ajusta conteos.',
    perms:['view_dashboard','manage_products','stock_in','adjust'] },
  viewer:  { name:'Solo lectura / Auditor', icon:'👁️', desc:'Ve todo, no modifica nada.',
    perms:['view_dashboard','view_costs','view_reports','export'] },
};
function roleLabel(code) { const r = ROLES[code]; return r ? `${r.icon} ${r.name}` : code; }

// CRUD de usuarios (Fase 1: sin contraseña, los permisos se aplican en el cliente).
function addUser(name, email, role) {
  name = (name || '').trim(); email = (email || '').trim();
  if (!name) throw new Error('El nombre es obligatorio.');
  if (!ROLES[role]) throw new Error('Rol inválido.');
  if (email && store.users.some(u => u.email && u.email.toLowerCase() === email.toLowerCase()))
    throw new Error(`Ya existe un usuario con el correo "${email}".`);
  const u = { id: uid(), name, email, role, tenantId: store.tenant?.id };
  store.users.push(u);
  save(LS_USERS, store.users);
  return u;
}
function updateUserRole(id, role) {
  if (!ROLES[role]) return;
  const u = store.users.find(x => x.id === id);
  if (!u) return;
  // No permitir quedarse sin ningún propietario.
  if (u.role === 'owner' && role !== 'owner' && store.users.filter(x => x.role === 'owner').length <= 1) {
    toast('Debe existir al menos un Propietario.', 'error'); return;
  }
  u.role = role;
  save(LS_USERS, store.users);
  render();
}
function removeUser(id) {
  const u = store.users.find(x => x.id === id);
  if (!u) return;
  if (u.role === 'owner' && store.users.filter(x => x.role === 'owner').length <= 1) {
    toast('No puedes eliminar al único Propietario.', 'error'); return;
  }
  if (!confirm(`¿Eliminar al usuario "${u.name}"?`)) return;
  store.users = store.users.filter(x => x.id !== id);
  save(LS_USERS, store.users);
  if (load(LS_ACTIVE, null) === id) save(LS_ACTIVE, store.users[0]?.id || null);
  render();
}
function switchActiveUser(id) {
  save(LS_ACTIVE, id);
  render();
  const u = activeUser();
  if (u) toast(`Ahora operas como ${u.name} (${roleLabel(u.role)}).`, 'info');
}

function activeUser() {
  const id = load(LS_ACTIVE, null);
  const u = (store.users || []).find(x => x.id === id);
  return u || (store.users || [])[0] || store.user || null;
}
// ¿El usuario activo tiene el permiso? El owner siempre; permisos de oro solo aplican a joyería.
function can(perm) {
  const u = activeUser();
  if (!u) return true; // sin usuarios definidos (demo viejo) → no se bloquea nada
  const role = ROLES[u.role];
  if (!role) return true;
  if ((perm === 'gold_spot' || perm === 'gold_buy') && !isJewelry()) return false;
  return role.perms === '*' || role.perms.includes(perm);
}

const MOVEMENT_LABELS = {
  in: 'Entrada', out: 'Salida',
  adjust_neg: 'Ajuste (−)', adjust_pos: 'Ajuste (+)'
};
const isIncoming = t => t === 'in' || t === 'adjust_pos';

const VERTICALS = [
  { code:'retail',   icon:'🏪', name:'Tienda',       desc:'Abarrotes, minimarket' },
  { code:'bakery',   icon:'🧁', name:'Repostería',   desc:'Insumos y productos horneados' },
  { code:'hardware', icon:'🔧', name:'Ferretería',   desc:'Herramientas y materiales' },
  { code:'pharmacy', icon:'💊', name:'Farmacia',     desc:'Medicamentos con lote' },
  { code:'petshop',  icon:'🐾', name:'Mascotas',     desc:'Alimento y accesorios' },
  { code:'jewelry',  icon:'💍', name:'Joyería',      desc:'Oro y piezas por gramo / quilataje' },
  { code:'other',    icon:'📦', name:'Otro',         desc:'Configuración personalizada' },
];

// Verticales cuyo inventario se mide por peso/medida y por tanto admiten cantidades decimales.
// El resto opera en unidades enteras (no se vende media unidad de tornillo).
const DECIMAL_UNITS = ['g','gr','gramo','gramos','kg','kilo','litro','l','ml','ct','quilate','quilates','metro','m','onza','oz'];
function unitAllowsDecimals(unit) {
  return DECIMAL_UNITS.includes(String(unit || '').trim().toLowerCase());
}
// step para inputs de cantidad según la unidad del producto.
function qtyStep(unit) { return unitAllowsDecimals(unit) ? '0.01' : '1'; }
function qtyMin(unit)  { return unitAllowsDecimals(unit) ? '0.01' : '1'; }
// Formatea una cantidad respetando decimales solo cuando hacen falta (3 → "3", 3.75 → "3,75").
function fmtQty(n) {
  const v = Number(n) || 0;
  return Number.isInteger(v) ? String(v) : v.toLocaleString('es-CO', { maximumFractionDigits: 3 });
}

// ---------- ORO / QUILATAJE ----------
// Leyes de oro soportadas y su pureza (fracción de oro fino).
const GOLD_KARATS = [
  { k: 24, label: '24K (oro fino)', purity: 1.000 },
  { k: 22, label: '22K',           purity: 0.916 },
  { k: 18, label: '18K',           purity: 0.750 },
  { k: 14, label: '14K',           purity: 0.585 },
  { k: 10, label: '10K',           purity: 0.417 },
  { k:  0, label: 'No aplica',     purity: 0      },
];
function karatPurity(k) { return (GOLD_KARATS.find(x => x.k === Number(k)) || { purity: 0 }).purity; }
// Valor de mercado del oro contenido en una pieza:
//   gramos × pureza(karat) × precio del gramo de oro fino (24K) configurado por el tenant.
function goldValue(grams, karat) {
  const spot = Number(store.settings?.goldSpotPerGram) || 0;
  return (Number(grams) || 0) * karatPurity(karat) * spot;
}
function isJewelry() { return store.tenant?.vertical === 'jewelry'; }

// Valor total del oro contenido en el inventario, al precio spot configurado.
function totalGoldValue() {
  const stock = stockByProduct();
  return store.products.reduce((a, p) => a + (Number(p.karat) > 0 ? goldValue(stock[p.id] ?? 0, p.karat) : 0), 0);
}
// Gramos de oro fino equivalente en inventario (suma ponderada por pureza).
function totalFineGrams() {
  const stock = stockByProduct();
  return store.products.reduce((a, p) => a + (Number(p.karat) > 0 ? (stock[p.id] ?? 0) * karatPurity(p.karat) : 0), 0);
}
function updateGoldSpot(value) {
  if (!can('gold_spot')) { toast('Tu perfil no puede editar la cotización del oro.', 'error'); return; }
  const v = Number(value);
  if (!store.settings) store.settings = {};
  store.settings.goldSpotPerGram = isNaN(v) || v < 0 ? 0 : v;
  store.settings.goldSpotUpdatedAt = new Date().toISOString();
  store.settings.goldSpotSource = 'manual';
  save(LS_SETTINGS, store.settings);
  render();
}

const TROY_OUNCE_GRAMS = 31.1035; // 1 onza troy = 31.1035 g

// Trae el precio spot del oro del día desde fuentes públicas gratuitas (solo demo).
// Oro en USD/onza troy → convierte a la moneda del tenant por gramo de oro fino (24K).
// PRODUCCIÓN: mover al backend con una API profesional con key (ver memoria del proyecto).
async function fetchGoldSpot() {
  if (!can('gold_spot')) { toast('Tu perfil no puede editar la cotización del oro.', 'error'); return; }
  const btn = document.getElementById('gold-fetch-btn');
  const currency = store.tenant?.currency || 'COP';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Consultando…'; }
  try {
    // 1) Precio del oro en USD por onza troy.
    const goldRes = await fetch('https://api.gold-api.com/price/XAU');
    if (!goldRes.ok) throw new Error('No se pudo obtener el precio del oro.');
    const gold = await goldRes.json();
    const usdPerOunce = Number(gold.price);
    if (!usdPerOunce) throw new Error('Respuesta de precio inválida.');

    // 2) Tasa de cambio USD → moneda del tenant (si no es USD).
    let rate = 1;
    if (currency !== 'USD') {
      const fxRes = await fetch('https://open.er-api.com/v6/latest/USD');
      if (!fxRes.ok) throw new Error('No se pudo obtener la tasa de cambio.');
      const fx = await fxRes.json();
      rate = Number(fx?.rates?.[currency]);
      if (!rate) throw new Error(`No hay tasa de cambio para ${currency}.`);
    }

    // 3) COP (u otra moneda) por gramo de oro fino.
    const perGramFine = (usdPerOunce / TROY_OUNCE_GRAMS) * rate;
    const rounded = Math.round(perGramFine);

    if (!store.settings) store.settings = {};
    store.settings.goldSpotPerGram = rounded;
    store.settings.goldSpotUpdatedAt = new Date().toISOString();
    store.settings.goldSpotSource = 'auto';
    save(LS_SETTINGS, store.settings);
    render();
    toast(`Cotización actualizada: ${formatMoney(rounded, currency)}/g (oro fino, ${usdPerOunce.toLocaleString('en-US')} USD/oz).`, 'success');
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Traer precio del día'; }
    toast(`No se pudo traer la cotización: ${e.message} Puedes ingresarla manualmente.`, 'error');
  }
}

  const sourceBadge = source === 'auto' ? ' · <span style="background:#d4edda;color:#155724;padding:1px 6px;border-radius:8px;font-size:10px">🌐 automático</span>'
                    : source === 'manual' ? ' · <span style="background:#e8d48a;color:#7a5c00;padding:1px 6px;border-radius:8px;font-size:10px">✎ manual</span>' : '';
  const fineGrams = totalFineGrams();
  return `
    <div class="card" style="background:linear-gradient(135deg,#fef9e7,#fdf2d0);border:1px solid #e8d48a;margin-bottom:16px">
      <div class="row" style="align-items:center;gap:20px;flex-wrap:wrap">
        <div style="font-size:32px">🥇</div>
        <div style="flex:1;min-width:220px">
          <div style="font-weight:700;color:#7a5c00">Cotización del oro (precio spot)</div>
          <div class="hint" style="color:#8a6d1f">Precio del gramo de oro fino (24K). Tráelo del día con un clic o ingrésalo manual — sirve para valuar el inventario y sugerir precios de compra/venta.</div>
        </div>
        <div class="field" style="min-width:200px">
          <label style="color:#7a5c00">Precio por gramo fino (${esc(currency)})</label>
          <input type="number" min="0" step="0.01" value="${spot || ''}" placeholder="Ej: 300000"
                 ${can('gold_spot') ? `onchange="updateGoldSpot(this.value)"` : 'disabled title="Tu perfil no puede editar la cotización"'} style="font-weight:600"/>
          <div class="hint" style="color:#8a6d1f">Actualizado: ${updated}${sourceBadge}${can('gold_spot') ? '' : ' · 🔒 solo Admin/Gerente'}</div>
        </div>
        ${can('gold_spot') ? `
        <div style="min-width:170px">
          <button id="gold-fetch-btn" class="btn btn-primary" onclick="fetchGoldSpot()" style="width:100%">🔄 Traer precio del día</button>
          <div class="hint" style="color:#8a6d1f;text-align:center;margin-top:4px">Cotización internacional</div>
        </div>` : ''}
        <div style="text-align:right;min-width:160px">
          <div class="stat-label" style="color:#7a5c00">Oro fino en inventario</div>
          <div style="font-size:20px;font-weight:700;color:#7a5c00">${fmtQty(Math.round(fineGrams * 100) / 100)} g</div>
          <div class="hint" style="color:#8a6d1f">${spot > 0 ? '≈ ' + formatMoney(totalGoldValue(), currency) : 'Configura el spot para valuar'}</div>
        </div>
      </div>
    </div>`;
}

// ---------- FLUJO COMPRA/VENTA DE ORO (solo joyería) ----------
// En joyería el precio de una pieza de oro se deriva del peso, la ley y el spot del día,
// más un margen de taller/fabricación. Estas funciones sugieren precios y calculan totales.
//
// Precio de COMPRA de oro a cliente (compra de oro usado / chatarra):
//   normalmente se paga un % del valor spot del oro fino contenido (la joyería gana en el descuento).
function suggestGoldBuyPrice(grams, karat, pctOfSpot = 0.90) {
  return goldValue(grams, karat) * pctOfSpot;
}
// Precio de VENTA de una pieza de oro:
//   valor del oro fino contenido + margen de fabricación/taller (% sobre el oro).
function suggestGoldSellPrice(grams, karat, makingPct = 0.25) {
  const base = goldValue(grams, karat);
  return base * (1 + makingPct);
}

const TIMEZONES  = ['America/Bogota','America/Mexico_City','America/Lima','America/Santiago','America/Buenos_Aires','America/Sao_Paulo','America/New_York','Europe/Madrid'];

function load(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; }
}
function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }

  tenant:    load(LS_TENANT, null),

  movements: load(LS_MOVEMENTS, []),
};

function hasTenant() { return !!store.tenant; }

// ---------- DERIVED ----------
function stockByProduct() {
  const s = {};
  for (const p of store.products) s[p.id] = 0;
  for (const m of store.movements) {
    if (s[m.productId] === undefined) s[m.productId] = 0;
    s[m.productId] += (isIncoming(m.type) ? 1 : -1) * m.quantity;
  }
  return s;
}
function stockOf(pid) { return stockByProduct()[pid] ?? 0; }
function totalUnits() {
  return Object.values(stockByProduct()).reduce((a, v) => a + Math.max(0, v), 0);
}
function lowStockProducts() {
  const s = stockByProduct();
  return store.products
    .filter(p => (s[p.id] ?? 0) < p.minStock)
    .map(p => ({ ...p, current: s[p.id] ?? 0, missing: p.minStock - (s[p.id] ?? 0) }));
}
function recentMovements(n = 10) {
  return [...store.movements].sort((a,b) => b.createdAt.localeCompare(a.createdAt)).slice(0, n);
}
function productName(id) { return store.products.find(p => p.id === id)?.name ?? '—'; }
function productSku(id)  { return store.products.find(p => p.id === id)?.sku ?? ''; }
function categories()   { return [...new Set(store.products.map(p => p.category))].sort(); }

// ---------- MUTATIONS ----------
// Guard de permisos: lanza si el usuario activo no tiene el permiso requerido.
function requirePerm(perm, action) {
  if (!can(perm)) throw new Error(`Tu perfil (${roleLabel(activeUser()?.role)}) no tiene permiso para ${action}.`);
}
function createProduct(data) {
  requirePerm('manage_products', 'crear productos');
  const exists = store.products.some(p => p.sku.toLowerCase() === data.sku.trim().toLowerCase());
  if (exists) throw new Error(`Ya existe un producto con SKU "${data.sku}".`);
  const p = { ...data, id: uid(), createdAt: new Date().toISOString() };
  store.products.push(p);
  save(LS_PRODUCTS, store.products);
  return p;
}
function updateProduct(id, patch) {
  requirePerm('manage_products', 'editar productos');
  const dup = store.products.find(p => p.sku.toLowerCase() === (patch.sku||'').trim().toLowerCase() && p.id !== id);
  if (dup) throw new Error(`Ya existe otro producto con SKU "${patch.sku}".`);
  const i = store.products.findIndex(p => p.id === id);
  if (i < 0) throw new Error('Producto no encontrado.');
  store.products[i] = { ...store.products[i], ...patch };
  save(LS_PRODUCTS, store.products);
}
function deleteProduct(id) {
  requirePerm('manage_products', 'eliminar productos');
  if (store.movements.some(m => m.productId === id)) {
    throw new Error('No se puede eliminar un producto con movimientos registrados.');
  }
  store.products = store.products.filter(p => p.id !== id);
  save(LS_PRODUCTS, store.products);
}
function registerMovement(input) {
  // Permiso según el tipo de movimiento.
  if (input.reason === 'Compra de oro a cliente') requirePerm('gold_buy', 'comprar oro a clientes');
  else if (input.type === 'in') requirePerm('stock_in', 'registrar entradas');
  else if (input.type === 'adjust_neg' || input.type === 'adjust_pos') requirePerm('adjust', 'hacer ajustes');
  else requirePerm('stock_out', 'registrar salidas');
  if (input.quantity <= 0) throw new Error('La cantidad debe ser mayor a 0.');
  const product = store.products.find(p => p.id === input.productId);
  if (!product) throw new Error('Producto no encontrado.');
  const delta = isIncoming(input.type) ? input.quantity : -input.quantity;
  const projected = stockOf(product.id) + delta;
  if (projected < 0) {
    throw new Error(`Stock insuficiente para "${product.name}". Disponible: ${stockOf(product.id)} ${product.unit}, solicitado: ${input.quantity} ${product.unit}.`);
  }
  const mv = { ...input, id: uid(), createdAt: new Date().toISOString() };
  store.movements.push(mv);
  save(LS_MOVEMENTS, store.movements);
  return mv;
}
function clearAllData() {
  [LS_TENANT, LS_USER, LS_USERS, LS_ACTIVE, LS_BRANCHES, LS_SETTINGS, LS_PRODUCTS, LS_MOVEMENTS].forEach(k => localStorage.removeItem(k));
  store.tenant = null; store.user = null; store.users = []; store.branches = []; store.settings = null;
  store.products = []; store.movements = [];
  onboardingState = { step: 0, data: {} };
}

  const vta = (pid, qty, daysAgo, priceMul) => {

  // Shampoo — margen bajo, rotación baja, con promo
  [15,5].forEach((d,i) => vta(shampoo, 2, d, i===0 ? mulPromo() : mulFull()));

function finishOnboarding() {
  const d = onboardingState.data;
  store.tenant = {
    id: uid(),
    name: d.companyName,
    vertical: d.vertical,
    customVerticalName: d.customVerticalName || '',
    taxId: d.taxId,

    phone: d.contactPhone,

  };

    name: d.adminName,
    email: d.adminEmail,
    role: 'Administrador',
  };
  // El usuario que crea la empresa es el Propietario (owner) con acceso total.
  store.users = [{ id: store.user.id, name: d.adminName, email: d.adminEmail, role: 'owner', tenantId: store.tenant.id }];
  store.branches = [{
    id: uid(),
    name: d.branchName,
    address: d.branchAddress,
    warehouse: d.warehouseName,
  }];
  store.settings = {
    valuationMethod: d.valuationMethod,
    allowNegativeStock: d.allowNegative === 'yes',
    adjustThreshold: Number(d.adjustThreshold || 500),
  };
  // Use catalog built during onboarding (editable, pre-filled or custom)
  const seeds = Array.isArray(d.initialProducts) ? d.initialProducts : [];
  const now = new Date().toISOString();
  store.products = seeds.map(p => ({
    id: uid(),
    sku: p.sku, name: p.name, category: p.category, unit: p.unit,
    minStock: Number(p.minStock) || 0,
    cost: Number(p.cost) || 0,
    price: Number(p.price) || 0,
    ...(p.karat != null ? { karat: Number(p.karat) || 0 } : {}),
    createdAt: now,
  }));
  // Generate "Saldo inicial" movements for products with currentStock > 0
  store.movements = [];
  seeds.forEach((seed, i) => {
    const qty = Number(seed.currentStock || 0);
    if (qty > 0) {
      const productId = store.products[i].id;
      store.movements.push({
        id: uid(),
        productId,
        type: 'in',
        quantity: qty,
        unitCost: Number(seed.cost) || 0,
        reason: 'Saldo inicial',
        reference: 'INI-' + seed.sku,
        createdAt: now,
      });
    }
  });

  save(LS_TENANT, store.tenant);
  save(LS_USER, store.user);
  save(LS_USERS, store.users);
  save(LS_ACTIVE, store.user.id);
  save(LS_BRANCHES, store.branches);
  save(LS_SETTINGS, store.settings);
  save(LS_PRODUCTS, store.products);
  save(LS_MOVEMENTS, store.movements);

  onboardingState = { step: 0, data: {} };
  location.hash = 'dashboard';
  currentView = 'dashboard';
  render();
  toast(`¡Bienvenido, ${store.tenant.name}! Tu sistema está listo.`, 'success');
}

  // Valor de inventario: precio de lista × stock. En joyería, si la pieza no tiene precio
  // de lista pero sí ley de oro, se valúa por el oro contenido al spot del día.
  const invValue = store.products.reduce((a,p) => {
    const qty = stock[p.id] ?? 0;
    const byPrice = qty * priceOf(p);
    if (isJewelry() && byPrice === 0 && Number(p.karat) > 0) return a + goldValue(qty, p.karat);
    return a + byPrice;
  }, 0);
  const circ = 2 * Math.PI * 42;
  const offset = circ - (score / 100) * circ;

  return `
    <div class="page">
      <div class="page-header">
        <div>
          <h1 class="page-title">Dashboard</h1>

// ----- Products view
let productFilters = { q: '', category: '', stock: 'all' };

function viewProducts() {
  const stock = stockByProduct();
  const q = productFilters.q.trim().toLowerCase();
  const rows = store.products
    .map(p => ({ ...p, current: stock[p.id] ?? 0 }))
    .filter(p => {
      if (q && !(p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || p.category.toLowerCase().includes(q))) return false;
      if (productFilters.category && p.category !== productFilters.category) return false;
      if (productFilters.stock === 'low' && p.current >= p.minStock) return false;
      if (productFilters.stock === 'ok' && p.current < p.minStock) return false;
      if (productFilters.stock === 'zero' && p.current !== 0) return false;
      return true;
    });

  return `
    <div class="page">
      <div class="page-header">
        <div>
          <h1 class="page-title">Productos</h1>
          <div class="page-subtitle">${store.products.length} producto(s) · ${totalUnits()} unidad(es) en stock</div>
        </div>
        ${can('manage_products') ? `<button class="btn btn-primary" onclick="openProductForm()">+ Nuevo producto</button>` : ''}
      </div>

      <div class="card">
        <div class="row" style="margin-bottom:12px">
          <div class="field" style="flex:1;min-width:200px">
            <input type="search" placeholder="Buscar por nombre, SKU o categoría…"
                   value="${esc(productFilters.q)}"
                   oninput="productFilters.q=this.value;render()">
          </div>
          <div class="field">
            <select onchange="productFilters.category=this.value;render()">
              <option value="">Todas las categorías</option>
              ${categories().map(c => `<option value="${esc(c)}" ${productFilters.category === c ? 'selected':''}>${esc(c)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <select onchange="productFilters.stock=this.value;render()">
              <option value="all" ${productFilters.stock==='all'?'selected':''}>Todo el stock</option>
              <option value="low" ${productFilters.stock==='low'?'selected':''}>Bajo mínimo</option>
              <option value="ok"  ${productFilters.stock==='ok' ?'selected':''}>Sobre mínimo</option>
              <option value="zero"${productFilters.stock==='zero'?'selected':''}>Sin stock</option>
            </select>
          </div>
        </div>

        ${(() => { const showCost = can('view_costs'); const showActions = can('manage_products'); return rows.length === 0
          ? `<div class="empty"><div class="empty-icon">🔍</div><strong>Sin resultados</strong><div>Ajusta los filtros o crea un nuevo producto.</div></div>`
          : `<table class="table">
              <thead><tr>
                <th>SKU</th><th>Nombre</th><th>Categoría</th><th>Unidad</th>
                ${isJewelry() ? '<th class="num">Ley</th>' : ''}
                <th class="num">Stock</th><th class="num">Mín.</th>
                ${isJewelry() ? '<th class="num" title="Valor del oro contenido al precio spot configurado">Valor oro</th>' : ''}
                ${showCost ? '<th class="num" title="Costo promedio ponderado (WAC) calculado sobre todas las compras registradas">Costo prom.</th>' : ''}
                <th class="num">Precio</th>${showCost ? '<th class="num">Margen</th>' : ''}
                <th>Estado</th>${showActions ? '<th></th>' : ''}
              </tr></thead>
              <tbody>
              ${rows.map(p => {
                const status = p.current === 0
                  ? '<span class="badge badge-danger">Sin stock</span>'
                  : p.current < p.minStock
                    ? '<span class="badge badge-warn">Bajo mínimo</span>'
                    : '<span class="badge badge-ok">OK</span>';
                const color = p.current === 0 ? 'var(--danger)' : (p.current < p.minStock ? 'var(--warning)' : 'var(--text)');
                const currency = store.tenant?.currency || 'COP';
                const karatLabel = (GOLD_KARATS.find(g => g.k === Number(p.karat)) || {}).label;
                const oroVal = isJewelry() && Number(p.karat) > 0 ? goldValue(p.current, p.karat) : 0;
                return `<tr>

                  <td style="font-weight:500">${esc(p.name)}</td>
                  <td>${esc(p.category)}</td>
                  <td>${esc(p.unit)}</td>
                  ${isJewelry() ? `<td class="num">${Number(p.karat) > 0 ? esc(karatLabel) : '<span class="text-muted">—</span>'}</td>` : ''}
                  <td class="num" style="color:${color};font-weight:${p.current<p.minStock?600:400}">${fmtQty(p.current)}</td>
                  <td class="num">${fmtQty(p.minStock)}</td>
                  ${isJewelry() ? `<td class="num">${oroVal > 0 ? formatMoney(oroVal, currency) : '<span class="text-muted">—</span>'}</td>` : ''}
                  ${showCost ? `<td class="num">${hasCost(p) ? formatMoney(costOf(p), currency) : '<span class="text-muted">—</span>'}</td>` : ''}
                  <td class="num">${formatMoney(priceOf(p), currency)}</td>
                  ${showCost ? `<td class="num">${marginBadge(p)}</td>` : ''}

              }).join('')}

             </table>`; })()}
      </div>
    </div>`;

function handleDeleteProduct(id, name) {
  if (!confirm(`¿Eliminar el producto "${name}"?`)) return;
  try { deleteProduct(id); toast(`"${name}" eliminado.`, 'success'); render(); }
  catch (e) { toast(e.message, 'error'); }
}

function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

// Ajusta el paso/min de los inputs de cantidad del modal de producto cuando cambia la unidad.
function syncQtySteps(unit) {
  const step = qtyStep(unit), min = qtyMin(unit);
  ['product-minstock','product-initialstock','quick-stock-qty'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.step = step; if (id !== 'product-minstock') el.min = min; }
  });
}

function quickAddStock(productId) {
  const qtyEl = document.getElementById('quick-stock-qty');
  const reasonEl = document.getElementById('quick-stock-reason');
  const qty = Number(qtyEl?.value);
  const reason = reasonEl?.value || 'Ajuste inicial';
  if (!qty || qty <= 0) { toast('Ingresa una cantidad mayor a 0.', 'error'); return; }
  try {
    registerMovement({
      productId, type: 'in', quantity: qty,
      reason, reference: 'QUICK-' + Date.now().toString(36).slice(-4)
    });
    const p = store.products.find(x => x.id === productId);
    toast(`+${fmtQty(qty)} ${p.unit} de "${p.name}" agregado. Stock: ${fmtQty(stockOf(productId))}`, 'success');
    // Keep modal open and refresh just the "Stock actual" input
    const stockInput = document.querySelector('.modal input[disabled]');
    if (stockInput) stockInput.value = `${fmtQty(stockOf(productId))} ${p.unit}`;
    if (qtyEl) qtyEl.value = '';
    render(); // refresh the product list underneath so when modal closes, data is fresh
    // Re-open modal because render() cleared it
    openProductForm(productId);
  } catch (e) { toast(e.message, 'error'); }
}

function submitProduct(e, id) {
  e.preventDefault();
  const f = e.target;
  const data = {
    sku: f.sku.value.trim(),
    name: f.name.value.trim(),
    category: f.category.value.trim(),
    unit: f.unit.value.trim(),
    minStock: Number(f.minStock.value),
    cost: Number(f.cost?.value || 0),
    price: Number(f.price.value),
  };
  if (f.karat) data.karat = Number(f.karat.value) || 0;
  try {
    if (id) {
      updateProduct(id, data);
      toast(`"${data.name}" actualizado.`, 'success');
    } else {
      const p = createProduct(data);
      const initial = Number(f.initialStock?.value ?? 0);
      if (initial > 0) {
        registerMovement({ productId: p.id, type: 'in', quantity: initial, unitCost: Number(data.cost) || 0, reason: 'Stock inicial', reference: 'INI-' + p.sku });
      }
      toast(`"${data.name}" creado.`, 'success');
    }
    closeModal();
    render();
  } catch (err) { toast(err.message, 'error'); }
}

function updateStockInHint(sel) {
  const p = store.products.find(x => x.id === sel.value);
  const hint = document.getElementById('stockin-hint');
  const costInput = document.getElementById('stockin-unitcost');
  const qtyInput = document.getElementById('stockin-qty');
  if (!hint) return;
  if (p) {
    const currency = store.tenant?.currency || 'COP';
    const current = costOf(p);
    if (qtyInput) { qtyInput.step = qtyStep(p.unit); qtyInput.min = qtyMin(p.unit); }
    let extra = '';
    // Compra de oro: sugerir costo por gramo derivado del spot del día.
    const spot = Number(store.settings?.goldSpotPerGram) || 0;
    if (isJewelry() && Number(p.karat) > 0 && spot > 0) {
      const finePerGram = karatPurity(p.karat) * spot;        // valor del oro fino en 1 g de esta ley
      const suggested = finePerGram * 0.90;                    // se compra al 90% del spot por defecto
      extra = ` · 🥇 Oro ${p.karat}K: 1 g = <strong>${formatMoney(finePerGram, currency)}</strong> de oro fino · sugerido de compra (90%): <strong>${formatMoney(suggested, currency)}/g</strong>`;
      if (costInput && Number(costInput.value) === 0) costInput.value = (Math.round(suggested * 100) / 100).toFixed(2);
    } else if (costInput && Number(costInput.value) === 0 && current > 0) {
      costInput.value = current.toFixed(2);
    }
    hint.innerHTML = `Stock: <strong>${fmtQty(stockOf(p.id))} ${esc(p.unit)}</strong> · Costo actual (${valuationMethodLabel()}): <strong>${formatMoney(current, currency)}</strong>${extra}`;
  } else {
    hint.innerHTML = '';
  }
}

function toggleStockOutPrice(form) {
  const field = document.getElementById('stockout-price-field');
  const input = document.getElementById('stockout-unitprice');
  if (!field) return;
  const isSale = form.reason.value === 'Venta';
  field.style.display = isSale ? '' : 'none';
  if (!isSale && input) input.value = 0;
  if (isSale) suggestStockOutPrice(form);
}

function suggestStockOutPrice(form) {
  const input = document.getElementById('stockout-unitprice');
  if (!input) return;
  const p = store.products.find(x => x.id === form.productId.value);
  if (!p) return;
  const spot = Number(store.settings?.goldSpotPerGram) || 0;
  // Venta de oro por gramo: precio sugerido = oro fino contenido en 1 g + 25% de taller/fabricación.
  if (isJewelry() && Number(p.karat) > 0 && unitAllowsDecimals(p.unit) && spot > 0) {
    const perGram = karatPurity(p.karat) * spot * 1.25;
    if (Number(input.value) === 0) input.value = (Math.round(perGram * 100) / 100).toFixed(2);
    return;
  }
  const listPrice = priceOf(p);
  if (Number(input.value) === 0 && listPrice > 0) input.value = listPrice.toFixed(2);
}

function validateOut(form) {
  const pid = form.productId.value;
  const qty = Number(form.quantity.value ?? 0);
  const hint = document.getElementById('stockout-hint');
  const err = document.getElementById('stockout-error');
  const qtyField = document.getElementById('qty-field');
  const btn = document.getElementById('stockout-submit');
  const p = store.products.find(x => x.id === pid);
  const currency = store.tenant?.currency || 'COP';
  const qtyInput = document.getElementById('stockout-qty');
  if (p && qtyInput) { qtyInput.step = qtyStep(p.unit); qtyInput.min = qtyMin(p.unit); }

  let goldHint = '';
  const spot = Number(store.settings?.goldSpotPerGram) || 0;
  if (p && isJewelry() && Number(p.karat) > 0 && spot > 0) {
    const finePerGram = karatPurity(p.karat) * spot;
    goldHint = ` · 🥇 Oro ${p.karat}K: ${formatMoney(finePerGram, currency)}/g de oro fino${qty > 0 && unitAllowsDecimals(p.unit) ? ` · ${fmtQty(qty)} g = <strong>${formatMoney(goldValue(qty, p.karat), currency)}</strong> en oro` : ''}`;
  }
  if (hint) hint.innerHTML = p
    ? `Disponible: <strong>${fmtQty(stockOf(p.id))} ${esc(p.unit)}</strong> · Mínimo: ${fmtQty(p.minStock)} · Precio de lista: <strong>${formatMoney(priceOf(p), currency)}</strong>${goldHint}`
    : '';

  if (form.reason?.value === 'Venta') suggestStockOutPrice(form);

  if (!p || qty <= 0) {
    if (err) err.style.display = 'none';
    if (qtyField) qtyField.classList.remove('invalid');
    if (btn) btn.disabled = false;
    return;
  }
  const available = stockOf(p.id);
  if (qty > available) {
    if (err) { err.textContent = `Stock insuficiente. Disponible: ${fmtQty(available)}.`; err.style.display = 'block'; }
    if (qtyField) qtyField.classList.add('invalid');
    if (btn) btn.disabled = true;
  } else {
    if (err) err.style.display = 'none';
    if (qtyField) qtyField.classList.remove('invalid');
    if (btn) btn.disabled = false;
  }
}

// ===================================================================
//  AI / ANALYTICS — pronóstico, cobertura, ABC, insights, health score
// ===================================================================
const DAY_MS = 24 * 3600 * 1000;

function priceOf(p) { return Number(p?.price ?? 0); }

// ----- Valoración de inventario -----
function valuationMethod() { return store.settings?.valuationMethod || 'promedio'; }
function valuationMethodLabel() {
  const m = valuationMethod();
  if (m === 'last') return 'Último costo';
  if (m === 'fifo') return 'FIFO';
  return 'Promedio ponderado (WAC)';
}
function incomingMovementsOf(productId) {
  return store.movements.filter(m => m.productId === productId && isIncoming(m.type));
}
function avgWAC(productId) {
  const movs = incomingMovementsOf(productId).filter(m => Number(m.unitCost) > 0);
  if (movs.length === 0) return 0;
  const totalQty = movs.reduce((a,m) => a + m.quantity, 0);
  const totalVal = movs.reduce((a,m) => a + m.quantity * Number(m.unitCost), 0);
  return totalQty > 0 ? totalVal / totalQty : 0;
}
function lastInCost(productId) {
  const movs = incomingMovementsOf(productId).filter(m => Number(m.unitCost) > 0)
    .sort((a,b) => b.createdAt.localeCompare(a.createdAt));
  return movs.length > 0 ? Number(movs[0].unitCost) : 0;
}
/**
 * costOf — costo unitario EFECTIVO del producto según el método de valoración.
 * - 'promedio' (default): promedio ponderado (WAC) de todas las entradas con costo
 * - 'last': costo de la última entrada con unitCost
 * - 'fifo': se trata como WAC por simplicidad en este prototipo
 * Si no hay movimientos con unitCost, usa el costo de referencia del producto.
 */
function costOf(p) {
  if (!p) return 0;
  const m = valuationMethod();
  const computed = m === 'last' ? lastInCost(p.id) : avgWAC(p.id);
  return computed > 0 ? computed : Number(p?.cost || 0);
}
function hasCost(p) { return costOf(p) > 0; }
function marginPct(p) {
  const pr = priceOf(p); const ct = costOf(p);
  if (pr <= 0 || ct <= 0) return 0;
  return ((pr - ct) / pr) * 100;
}
function marginBadge(p) {
  if (!hasCost(p)) return '<span class="badge badge-muted" title="Ingresa el costo unitario para calcular margen">Falta costo</span>';
  const mp = marginPct(p);
  const cls = mp >= 30 ? 'badge-ok' : mp >= 15 ? 'badge-info' : mp > 0 ? 'badge-warn' : 'badge-muted';
  return `<span class="badge ${cls}">${mp.toFixed(1)}%</span>`;
}
function movementsSince(productId, days) {
  const since = Date.now() - days * DAY_MS;
  return store.movements.filter(m => m.productId === productId && new Date(m.createdAt).getTime() >= since);
}
function outQtySince(productId, days) {
  return movementsSince(productId, days).filter(m => !isIncoming(m.type)).reduce((s,m) => s + m.quantity, 0);
}
function inQtySince(productId, days) {
  return movementsSince(productId, days).filter(m => isIncoming(m.type)).reduce((s,m) => s + m.quantity, 0);
}
// Ingreso unitario efectivo de un movimiento de salida: unitPrice del movimiento si se registró, si no el precio de lista del producto.
function movementUnitPrice(m, product) {
  const up = Number(m?.unitPrice);
  if (up > 0) return up;
  const p = product || store.products.find(pp => pp.id === m.productId);
  return priceOf(p);
}
function movementRevenue(m, product) {
  if (isIncoming(m.type)) return 0;
  return m.quantity * movementUnitPrice(m, product);
}
function outRevenueSince(productId, days) {
  const p = store.products.find(pp => pp.id === productId);
  return movementsSince(productId, days)
    .filter(m => !isIncoming(m.type))
    .reduce((s, m) => s + movementRevenue(m, p), 0);
}
// Precio de venta promedio efectivo de los últimos N días. Útil para reportes de rentabilidad y ABC.
function avgSalePrice(productId, days = 30) {
  const p = store.products.find(pp => pp.id === productId);
  const movs = movementsSince(productId, days).filter(m => !isIncoming(m.type));
  const qty = movs.reduce((s,m) => s + m.quantity, 0);
  if (qty === 0) return priceOf(p);
  const rev = movs.reduce((s,m) => s + m.quantity * movementUnitPrice(m, p), 0);
  return rev / qty;
}
function avgDailyOut(productId, days = 30) {
  return outQtySince(productId, days) / days;
}
function daysOfCoverage(productId, days = 30) {
  const v = avgDailyOut(productId, days);
  if (v <= 0) return Infinity;
  return stockOf(productId) / v;
}
function lastMovementAt(productId) {
  const m = store.movements.filter(x => x.productId === productId)
    .sort((a,b) => b.createdAt.localeCompare(a.createdAt))[0];
  return m ? new Date(m.createdAt) : null;
}
function daysSinceLastMovement(productId) {
  const d = lastMovementAt(productId);
  return d ? Math.floor((Date.now() - d.getTime()) / DAY_MS) : Infinity;
}

function abcClassification(days = 30) {
  const byId = {};
  store.products.forEach(p => {
    const out = outQtySince(p.id, days);
    const val = outRevenueSince(p.id, days);
    byId[p.id] = { p, out, val, cls: 'Z' };
  });
  const sorted = Object.values(byId).filter(x => x.val > 0).sort((a,b) => b.val - a.val);
  const total = sorted.reduce((s,x) => s + x.val, 0);
  let cum = 0;
  sorted.forEach(x => {
    cum += x.val;
    const pct = total > 0 ? cum / total : 0;
    x.cls = pct <= 0.80 ? 'A' : pct <= 0.95 ? 'B' : 'C';
  });
  const result = {};
  Object.values(byId).forEach(x => { result[x.p.id] = x.cls; });
  return result;
}

function suggestReorder(product, leadDays = 7, safetyDays = 3, targetDays = 30) {
  const v = avgDailyOut(product.id, 30);
  if (v <= 0) return null;
  const stock = stockOf(product.id);
  const daysLeft = stock / v;
  if (daysLeft > leadDays + safetyDays + 3) return null;
  const qty = Math.ceil(v * (targetDays + safetyDays) - stock);
  if (qty <= 0) return null;
  // Si ya no hay tiempo de recibir a tiempo (daysLeft ≤ leadDays), la orden es urgente
  const urgent = daysLeft <= leadDays;
  const reorderByDate = urgent ? null : new Date(Date.now() + (daysLeft - leadDays) * DAY_MS);
  return { qty, daysLeft: Math.floor(daysLeft), reorderByDate, urgent, avgDaily: v };
}

function coverageLabel(days) {
  if (!isFinite(days)) return { text:'sin consumo', color:'var(--muted)', level:'muted' };
  if (days < 3)  return { text:`${days.toFixed(1)} días`, color:'var(--danger)',  level:'danger'  };
  if (days < 10) return { text:`${days.toFixed(0)} días`, color:'var(--warning)', level:'warning' };
  if (days > 90) return { text:`${days.toFixed(0)} días`, color:'var(--warning)', level:'warning' };
  return { text:`${days.toFixed(0)} días`, color:'var(--success)', level:'ok' };
}

function computeInsights() {
  const abc = abcClassification(30);
  const urgent = [], toReorder = [], overstock = [], dead = [], noMargin = [], stars = [];
  for (const p of store.products) {
    const s   = stockOf(p.id);
    const cov = daysOfCoverage(p.id, 30);
    const last= daysSinceLastMovement(p.id);
    const out = outQtySince(p.id, 30);
    const cls = abc[p.id] || 'Z';
    const mp  = marginPct(p);

    if (s === 0 && out > 0) urgent.push(p);
    else if (cov < 3)       urgent.push(p);
    else if (cov < 10)      toReorder.push(p);

    if (isFinite(cov) && cov > 90 && s > 0 && out > 0) overstock.push(p);
    if (last >= 30 && s > 0) dead.push(p);
    if (mp > 0 && mp < 10 && (cls === 'A' || cls === 'B')) noMargin.push(p);
    if (mp > 30 && cls === 'A') stars.push(p);
  }
  const out = [];
  if (urgent.length)    out.push({ level:'danger',  icon:'🚨', title:`${urgent.length} producto(s) requieren reposición urgente`,    message:'Cobertura menor a 3 días o sin stock con ventas recientes.', products:urgent });
  if (toReorder.length) out.push({ level:'warning', icon:'⏰', title:`${toReorder.length} producto(s) se están agotando`,              message:'Entre 3 y 10 días de cobertura. Planifica la compra pronto.', products:toReorder });
  if (overstock.length) out.push({ level:'warning', icon:'📦', title:`${overstock.length} producto(s) con sobrestock`,                message:'Más de 90 días de cobertura. Considera promociones o detener compras.', products:overstock });
  if (dead.length)      out.push({ level:'warning', icon:'💤', title:`${dead.length} producto(s) sin movimiento hace 30+ días`,       message:'Candidatos a liquidar o descatalogar — ocupan capital.', products:dead });
  if (noMargin.length)  out.push({ level:'info',    icon:'💸', title:`${noMargin.length} best-seller(s) con margen bajo`,             message:'Productos A/B con margen menor al 10%. Oportunidad para negociar costo o subir precio.', products:noMargin });
  if (stars.length)     out.push({ level:'success', icon:'⭐', title:`${stars.length} producto(s) estrella`,                          message:'Alta rotación y margen superior al 30%. Mantenlos siempre surtidos.', products:stars });
  if (!out.length)      out.push({ level:'success', icon:'✅', title:'Todo bajo control',                                              message:'No detectamos problemas críticos en el inventario.', products:[] });
  return out;
}

function healthScore() {
  const products = store.products;
  if (products.length === 0) return { score:0, components:{ stock:0, rotation:0, dead:0, margin:0 } };
  const stock = stockByProduct();
  const ok    = products.filter(p => (stock[p.id] ?? 0) >= p.minStock).length;
  const moved = products.filter(p => movementsSince(p.id, 30).length > 0).length;
  const alive = products.filter(p => daysSinceLastMovement(p.id) < 30).length;
  const margins = products.map(p => marginPct(p)).filter(m => m > 0);
  const avgMargin = margins.length ? margins.reduce((a,b) => a+b, 0) / margins.length : 0;

  const stockScore    = Math.round((ok    / products.length) * 100);
  const rotationScore = Math.round((moved / products.length) * 100);
  const deadScore     = Math.round((alive / products.length) * 100);
  const marginScore   = Math.min(100, Math.round((avgMargin / 40) * 100));
  const score = Math.round(stockScore * 0.35 + rotationScore * 0.25 + deadScore * 0.2 + marginScore * 0.2);
  return { score, components:{ stock:stockScore, rotation:rotationScore, dead:deadScore, margin:marginScore } };
}
function scoreLabel(s) {
  if (s >= 85) return { label:'Excelente', color:'var(--success)' };
  if (s >= 70) return { label:'Bueno',     color:'var(--success)' };
  if (s >= 50) return { label:'Regular',   color:'var(--warning)' };
  return         { label:'Crítico',        color:'var(--danger)'  };
}

    : `<div class="row" style="gap:8px;flex-wrap:wrap"><span class="badge" style="background:${meta.bg};color:${meta.color}">${items.length} producto(s)</span><span class="badge badge-info">Ingreso 30d: ${formatMoney(groupRev, currency)}</span><span class="badge">${groupPct.toFixed(1)}% del total</span></div>`;

  const html = `
    <div class="modal-overlay" onmousedown="this._downOnSelf=(event.target===this)" onmouseup="if(this._downOnSelf&&event.target===this){closeModal()} this._downOnSelf=false">
      <div class="modal" style="max-width:880px">
        <div class="modal-header" style="background:${meta.bg}">
          <h2 style="color:${meta.color}">${meta.emoji} ${meta.label}</h2>
          <button class="close-x" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <p style="margin:0 0 12px;color:var(--text);font-size:13.5px;line-height:1.5">${meta.desc}</p>
          ${summaryHtml}
          <div style="margin-top:14px">${bodyHtml}</div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal()">Cerrar</button>
          <button class="btn btn-primary" onclick="closeModal();navigate('products')">Ir al catálogo</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modal-root').innerHTML = html;
}

let chatState = { open:false, messages:[] };

function openChat() {
  chatState.open = true;
  if (chatState.messages.length === 0) {
    chatState.messages.push({ role:'bot', text:'¡Hola! Soy el asistente de Inventra. Pregúntame en lenguaje natural sobre stock, ventas, alertas o pídeme un reporte rápido.' });
  }
  renderChat();
}
function closeChat() { chatState.open = false; renderChat(); }
function sendChatInput() {
  const i = document.getElementById('chat-input');
  const v = (i?.value || '').trim();
  if (!v) return;
  sendChat(v);
  if (i) i.value = '';
}
function sendChat(text) {
  chatState.messages.push({ role:'user', text });
  const reply = chatReply(text);
  chatState.messages.push({ role:'bot', text: reply });
  renderChat();
  setTimeout(() => {
    const body = document.getElementById('chat-body');
    if (body) body.scrollTop = body.scrollHeight;
    document.getElementById('chat-input')?.focus();
  }, 20);
}
function chatFindProduct(text) {
  const t = text.toLowerCase();
  return store.products.find(p =>
    t.includes(p.name.toLowerCase()) ||
    t.includes(p.sku.toLowerCase()) ||
    p.name.toLowerCase().split(/\s+/).some(w => w.length > 3 && t.includes(w))
  );
}
function chatReply(text) {
  const t = text.toLowerCase().trim();
  const currency = store.tenant?.currency || 'COP';
  const windowDays = /semana/.test(t) ? 7 : /hoy/.test(t) ? 1 : 30;

  if (/(hola|buen[oa]s|hey|hi\b)/.test(t)) return '¡Hola! ¿Qué quieres consultar? Dime por ejemplo: "stock de arroz", "qué debo reponer", "top productos" o "valor de inventario".';
  if (/(ayuda|help|qu[eé] pod[eé]s)/.test(t)) return 'Puedo ayudarte con:\n• Stock de un producto\n• Ventas / compras del período\n• Alertas y reposiciones sugeridas\n• Top productos por rotación\n• Valor del inventario\n• Margen y rentabilidad\n• Productos sin movimiento\n• Salud general del inventario';

  if (/(repon|pedir|compr|cu[aá]ndo.*ped|pron[oó]stic|reabastec|sugier)/.test(t)) {
    const rs = store.products.map(p => ({ p, s:suggestReorder(p) })).filter(x => x.s)
      .sort((a,b) => a.s.daysLeft - b.s.daysLeft);
    if (rs.length === 0) return '✅ Nada urgente por pedir. Todo el stock tiene cobertura holgada.';
    return '🔮 Próximas reposiciones sugeridas:\n' + rs.slice(0,6).map(x =>
      `• ${x.p.name}: pedir ${x.s.qty} ${x.p.unit} ${x.s.urgent ? '🚨 YA' : 'antes del ' + x.s.reorderByDate.toLocaleDateString('es')} (${x.s.daysLeft}d restantes)`
    ).join('\n');
  }

  if (/(alert|bajo|m[ií]nim|urge)/.test(t)) {
    const low = lowStockProducts();
    if (low.length === 0) return '✅ No hay productos bajo el mínimo.';
    return `🚨 ${low.length} producto(s) bajo el mínimo:\n` + low.slice(0,6).map(p =>
      `• ${p.name} — ${p.current}/${p.minStock} ${p.unit}`
    ).join('\n') + (low.length > 6 ? `\n… y ${low.length - 6} más.` : '');
  }

  if (/(muert|sin movimiento|no se mueve|no vend)/.test(t)) {
    const dead = store.products.filter(p => daysSinceLastMovement(p.id) >= 30 && stockOf(p.id) > 0);
    if (dead.length === 0) return '✅ Todos tus productos con stock han tenido movimiento en los últimos 30 días.';
    return `💤 ${dead.length} producto(s) sin movimiento 30+ días:\n` + dead.slice(0,6).map(p => `• ${p.name} (stock ${stockOf(p.id)} ${p.unit})`).join('\n');
  }

  if (/(top|m[aá]s (vend|salid)|ranking|estrell)/.test(t)) {
    const rows = store.products.map(p => ({ p, out:outQtySince(p.id, windowDays) }))
      .filter(x => x.out > 0).sort((a,b) => b.out - a.out).slice(0,5);
    if (rows.length === 0) return 'Aún no hay movimientos para calcular un top.';
    return `🏆 Top 5 por salidas (${windowDays} días):\n` + rows.map((r,i) => `${i+1}. ${r.p.name} — ${r.out} ${r.p.unit}`).join('\n');
  }

  if (/(valor|cu[aá]nto (plata|dinero)|capital|parad)/.test(t)) {
    const s = stockByProduct();
    const valPrice = store.products.reduce((a,p) => a + (s[p.id] ?? 0) * priceOf(p), 0);
    const valCost  = store.products.reduce((a,p) => a + (s[p.id] ?? 0) * costOf(p), 0);
    return `💰 Valor del inventario:\n• A precio de venta: ${formatMoney(valPrice, currency)}\n• A costo: ${formatMoney(valCost, currency)}\n• Ganancia potencial: ${formatMoney(valPrice - valCost, currency)}`;
  }

  if (/(margen|rentabil|utilidad|ganan)/.test(t)) {
    const p = chatFindProduct(t);
    if (p) {
      if (!hasCost(p)) return `⚠️ ${p.name}: falta el costo unitario. Edita el producto para ingresarlo y poder calcular margen y utilidad.`;
      return `📊 ${p.name}: margen ${marginPct(p).toFixed(1)}%\n• Costo: ${formatMoney(costOf(p), currency)}\n• Precio: ${formatMoney(priceOf(p), currency)}\n• Utilidad unitaria: ${formatMoney(priceOf(p) - costOf(p), currency)}`;
    }
    const withCost = store.products.filter(hasCost);
    if (withCost.length === 0) return '⚠️ Ningún producto tiene costo cargado. Edita los productos para ingresar el costo unitario y obtener márgenes.';
    const avg = withCost.reduce((a,p) => a + marginPct(p), 0) / withCost.length;
    const total = store.products.length;
    const missing = total - withCost.length;
    return `📊 Margen promedio del catálogo: ${avg.toFixed(1)}% (calculado sobre ${withCost.length}/${total} productos con costo)${missing > 0 ? `.\n⚠️ ${missing} producto(s) sin costo cargado no se incluyen.` : '.'}`;
  }

  if (/(vend|venta|sali|sacado)/.test(t)) {
    const p = chatFindProduct(t);
    if (p) {
      const q = outQtySince(p.id, windowDays);
      const revenue = outRevenueSince(p.id, windowDays);
      return `📤 ${p.name}: ${q} ${p.unit}(s) vendidos en ${windowDays} días\n• Ingresos: ${formatMoney(revenue, currency)}`;
    }
    const total = store.products.reduce((a,p) => a + outQtySince(p.id, windowDays), 0);
    const revenue = store.products.reduce((a,p) => a + outRevenueSince(p.id, windowDays), 0);
    return `📤 Ventas últimos ${windowDays} días: ${total} unidad(es) · Ingresos: ${formatMoney(revenue, currency)}`;
  }

  if (/(compr|entrada|ingres|recibi)/.test(t)) {
    const p = chatFindProduct(t);
    if (p) return `📥 ${p.name}: entraron ${inQtySince(p.id, windowDays)} ${p.unit}(s) en ${windowDays} días.`;
    const total = store.products.reduce((a,p) => a + inQtySince(p.id, windowDays), 0);
    return `📥 Entradas totales en ${windowDays} días: ${total} unidad(es).`;
  }

  if (/(cobertura|d[ií]as? resta|hasta cu[aá]ndo|aguant)/.test(t)) {
    const p = chatFindProduct(t);
    if (p) {
      const cov = daysOfCoverage(p.id, 30);
      const v = avgDailyOut(p.id, 30);
      if (!isFinite(cov)) return `${p.name} no tuvo ventas en 30 días, no se puede estimar cobertura.`;
      return `⏳ ${p.name}: cobertura de ${cov.toFixed(1)} días\n• Stock: ${stockOf(p.id)} ${p.unit}\n• Consumo: ${v.toFixed(2)} ${p.unit}/día`;
    }
    return 'Dime un producto para calcular días de cobertura. Ej: "cobertura de gaseosa".';
  }

  if (/(stock|cu[aá]nto tengo|hay de|qued[ao]n)/.test(t)) {
    const p = chatFindProduct(t);
    if (p) return `📦 ${p.name}: ${stockOf(p.id)} ${p.unit} (mínimo ${p.minStock}). ${stockOf(p.id) < p.minStock ? '⚠️ Bajo el mínimo.' : '✅ OK.'}`;
    return `Hay ${totalUnits()} unidad(es) distribuidas en ${store.products.length} productos. Dime un producto específico para el detalle.`;
  }

  if (/(salud|score|estado general|c[oó]mo (va|estoy|est[aá])n?)/.test(t)) {
    const { score, components } = healthScore();
    return `🧠 Salud del inventario: ${score}/100 (${scoreLabel(score).label})\n• Stock OK: ${components.stock}%\n• Rotación: ${components.rotation}%\n• Sin stock muerto: ${components.dead}%\n• Margen: ${components.margin}%`;
  }

  if (/(abc|clasific)/.test(t)) {
    const abc = abcClassification(30);
    const counts = { A:0, B:0, C:0, Z:0 };
    store.products.forEach(p => counts[abc[p.id] || 'Z']++);
    return `🔤 Clasificación ABC (30 días):\n• A (alta): ${counts.A}\n• B (media): ${counts.B}\n• C (baja): ${counts.C}\n• Sin movimiento: ${counts.Z}`;
  }

  const p = chatFindProduct(t);
  if (p) return `Encontré "${p.name}". Stock: ${stockOf(p.id)} ${p.unit}, precio ${formatMoney(priceOf(p), currency)}, margen ${marginPct(p).toFixed(1)}%. ¿Qué quieres saber sobre él?`;

  return 'No estoy seguro de entender. Prueba con: "qué debo reponer", "stock de arroz", "top productos", "valor de inventario", "productos muertos" o "ayuda".';
}

// ----- Reports view
let reportFilters = { from:'', to:'', productId:'', category:'', type:'' };
let reportTab = 'inventory';
const REPORT_TABS = [
  { key:'inventory',     label:'Inventario actual' },
  { key:'movements',     label:'Movimientos' },
  { key:'by-category',   label:'Por categoría' },
  { key:'top-products',  label:'Top productos' },
  { key:'profitability', label:'Rentabilidad' },
  { key:'forecast',      label:'Pronóstico' },
];

function inDateRange(iso, from, to) {
  const t = new Date(iso).getTime();
  if (from && t < new Date(from + 'T00:00:00').getTime()) return false;
  if (to   && t > new Date(to   + 'T23:59:59').getTime()) return false;
  return true;
}
function formatMoney(n, currency) {
  try { return new Intl.NumberFormat('es-CO', { style:'currency', currency, maximumFractionDigits:0 }).format(n); }
  catch { return `${currency} ${Math.round(n).toLocaleString('es-CO')}`; }
}
function clearReportFilters() {
  reportFilters = { from:'', to:'', productId:'', category:'', type:'' };
  render();
}
function computeReportData() {
  const filteredProducts = store.products.filter(p => {
    if (reportFilters.category  && p.category !== reportFilters.category)  return false;
    if (reportFilters.productId && p.id       !== reportFilters.productId) return false;
    return true;
  });
  const pIds = new Set(filteredProducts.map(p => p.id));
  const filteredMovements = store.movements.filter(m => {
    if (!pIds.has(m.productId)) return false;
    if (reportFilters.type && m.type !== reportFilters.type) return false;
    if (!inDateRange(m.createdAt, reportFilters.from, reportFilters.to)) return false;
    return true;
  });
  return { filteredProducts, filteredMovements, stock: stockByProduct() };
}

function viewReports() {
  const currency = store.tenant?.currency || 'COP';
  const cats = categories();
  const { filteredProducts, filteredMovements, stock } = computeReportData();

  let totalIn = 0, totalOut = 0;
  filteredMovements.forEach(m => { isIncoming(m.type) ? totalIn += m.quantity : totalOut += m.quantity; });
  const totalUnitsFiltered = filteredProducts.reduce((s,p) => s + Math.max(0, stock[p.id] ?? 0), 0);
  const inventoryValue     = filteredProducts.reduce((s,p) => s + (stock[p.id] ?? 0) * (p.price ?? 0), 0);

  return `
    <div class="page">
      <div class="page-header">
        <div>
          <h1 class="page-title">Reportes</h1>

            <input type="date" value="${esc(reportFilters.from)}" onchange="reportFilters.from=this.value;render()"/>
